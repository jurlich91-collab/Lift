<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lift</title>
<!-- Lift v1.8.0 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#262A31">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Palette: graphite base, IPF plate colours for programs (red 25kg, blue 20kg, yellow 15kg) */
:root{
  --bg:#262A31; --surface:#333841; --line:#434955; --text:#F3F4F6; --muted:#9AA2AF;
  --red:#D9403F; --blue:#2E6FDB; --yellow:#F1C232; --green:#3FB56B; --purple:#B067E3;
  --accent:var(--yellow); --accent-ink:#1E1A08;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --tabs:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{padding-top:var(--sat)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;min-height:44px}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:48px}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number]{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;text-align:center;padding:6px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:20px;font-weight:700;margin:24px 0 10px}
h3{font-size:17px;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
#app{padding:16px 16px calc(var(--tabs) + var(--sab) + 24px);max-width:560px;margin:0 auto}
#app.with-timer{padding-bottom:calc(var(--tabs) + var(--sab) + 130px)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.back{color:var(--muted);font-size:16px;padding:0 6px 0 0}
.card{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:0 18px;
  min-height:52px;font-weight:700;font-size:17px;background:var(--surface);border:1px solid var(--line);width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;color:var(--muted);min-height:44px}
.btn:disabled{opacity:.45}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700}
.pill.pr{background:var(--accent);color:var(--accent-ink)}
.swatch{width:10px;height:38px;border-radius:5px;flex:none}

/* program cards on home */
.program{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:14px;padding:14px 16px;width:100%;text-align:left;margin-bottom:10px}
.program .name{font-size:20px;font-weight:800}
.program.next{outline:2px solid var(--accent);outline-offset:-2px}
.program .go{margin-left:auto;color:var(--muted)}

/* workout */
.ex{background:var(--surface);border-radius:14px;padding:12px 12px 8px;margin-bottom:12px}
.ex header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 4px 8px}
.ex .target{color:var(--muted);font-size:14px;white-space:nowrap;display:block}
.sets{display:grid;grid-template-columns:36px 1fr 1fr 60px;gap:8px;align-items:center}
.sets .hd{color:var(--muted);font-size:13px;text-align:center;padding-bottom:2px}
.sets .hd:first-child{text-align:left;padding-left:4px}
.set-n{color:var(--muted);font-weight:700;padding-left:4px}
.set-n .last{display:block;font-size:11px;font-weight:500;white-space:nowrap}
.set-n .last .h{color:var(--text)}
.done .set-n .last{visibility:hidden}
.check{height:48px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.check.done{background:var(--green);border-color:var(--green);color:#082F14}
.done input{opacity:.55}
.ex footer{display:flex;justify-content:space-between;padding-top:8px}
.ss-note{color:var(--muted);font-size:13px;padding:0 4px 8px}
.ex header .ctl{display:flex;gap:2px;flex:none}
.ex header .ctl button,.editor-ex .hdr .icon,.edrow .icon{width:40px;min-height:40px;color:var(--muted);font-size:18px;font-weight:700;border-radius:8px}
.ex header .ctl button:disabled{opacity:.3}
.ex header .ctl button.rm{color:var(--red)}
/* edit logged workout */
.edrow{display:grid;grid-template-columns:36px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.edrow .set-n{padding-left:4px}
/* meals */
.meal{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.meal table td,.meal table th{padding:7px 3px;font-size:14px}
.meal table td:first-child{width:40%}
.meal table td.q{color:var(--muted);text-align:left;font-size:13px}
.meal tr.tot td{font-weight:800;border-bottom:0;border-top:2px solid var(--line)}
.meal .alt{color:var(--muted);font-size:13px;font-weight:600;margin-left:6px}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.targets .stat{padding:10px 8px;text-align:center}
.targets .stat .v{font-size:20px}
.targets .stat .v small{font-size:12px;font-weight:500;color:var(--muted)}
.targets .stat.over .v{color:var(--red)}
.targets .stat.short .v{color:var(--yellow)}
.notes{color:var(--muted);font-size:14px;line-height:1.45}
.notes p{margin:0 0 8px}
textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:60vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.4;resize:vertical}
.prflash{color:var(--accent);font-weight:800;font-size:13px;text-align:center}
textarea.note{min-height:96px;font-family:inherit;font-size:16px}
/* daily tracker */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daynav button{width:48px;min-height:44px;border-radius:10px;background:var(--surface);font-size:20px;font-weight:700}
.daynav button:disabled{opacity:.3}
.daynav .d{text-align:center;flex:1}
.tick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.tick:last-child{border-bottom:0}
.tick .check{width:48px;flex:none}
.tick .m{flex:1;min-width:0}
.tick .m .n{font-weight:700}
.tick .k{text-align:right;white-space:nowrap}
.weigh{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.banner{background:var(--surface);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}

/* timer bar */
#timer{position:fixed;left:0;right:0;bottom:calc(var(--tabs) + var(--sab));background:var(--surface);
  border-top:1px solid var(--line);padding:10px 16px 12px;display:none;z-index:20}
#timer.on{display:block}
#timer .t{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
#timer .t.over{color:var(--accent)}
#timer .ctl{display:flex;gap:8px}
#timer .ctl button{background:var(--bg);border:1px solid var(--line);border-radius:10px;min-width:56px;padding:0 12px;font-weight:700}
#timer .bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
#timer .bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabs) + var(--sab));padding-bottom:var(--sab);
  background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:30}
#tabs button{flex:1;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#tabs button.on{color:var(--text)}
#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs.hidden{display:none}

/* lists */
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .chev{color:var(--muted)}
canvas{width:100%;height:150px;display:block}
.chart-title{color:var(--muted);font-size:14px;margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);font-weight:500}
th{color:var(--muted);font-weight:600;font-size:14px}
td:first-child,th:first-child{text-align:left}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px;flex:1}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label.f{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.field input{font-size:17px;font-weight:500;text-align:left;padding:10px 12px}
.field input[type=number]{text-align:center;font-weight:700}
.editor-ex{background:var(--surface);border-radius:14px;padding:12px;margin-bottom:10px}
.editor-ex .hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.editor-ex .hdr select{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:48px;-webkit-appearance:none}
.editor-ex .icon{width:44px;color:var(--muted);font-size:20px;font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;min-height:44px}
.toggle input{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 12px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* mobility */
.banner.pain{border-left-color:var(--red)}
.mobprog{height:4px;background:var(--line);border-radius:2px;margin:-4px 0 12px;overflow:hidden}
.mobprog i{display:block;height:100%;background:var(--accent)}
.cues{margin:0;padding-left:20px;line-height:1.4}
.cues li{margin:6px 0}
.cues.small{font-size:14px}
.mobtimer{text-align:center;margin-bottom:12px}
.mobtimer .t{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.mobtimer .t.on{color:var(--accent)}
.mobtimer .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.mobtimer .bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.seg button{min-height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card.cur{outline:2px solid var(--accent);outline-offset:-2px}
/* exercise diagrams */
.visw{margin:0 0 8px}.vis{width:100%;display:block;max-height:190px}.vis.one{max-height:150px}
.viscap{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.35}.viscap b{color:var(--text)}
.near{stroke:var(--text);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.far{stroke:#6B7380;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.head{fill:var(--text)}.prop{stroke:var(--muted);stroke-width:1.5}.box{fill:var(--line)}.towel{fill:var(--muted)}
.band{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:3 2}.focus{fill:var(--accent);opacity:.3}
.arrow{stroke:var(--accent);stroke-width:1.6;fill:none}.vt{fill:var(--muted);font-size:7px}.sep{stroke:var(--line);stroke-width:1}
.vcard{padding:10px 12px}
a.btn{text-decoration:none;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer">
  <div class="row">
    <div>
      <div class="small muted" id="timer-label">Rest</div>
      <div class="t num" id="timer-t">1:30</div>
    </div>
    <div class="ctl">
      <button data-action="timer-adj" data-v="-15">−15</button>
      <button data-action="timer-adj" data-v="15">+15</button>
      <button data-action="timer-stop">Skip</button>
    </div>
  </div>
  <div class="bar"><i id="timer-bar"></i></div>
</div>
<nav id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Lift</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  <button data-tab="exercises"><svg viewBox="0 0 24 24"><path d="M4 19L9 9l4 6 3-4 4 8"/></svg>Progress</button>
  <button data-tab="mobility"><svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6v6M12 12l-5 4M12 12l5 4M9 9H5M15 9h4M7 16l-2 5M17 16l2 5"/></svg>Mobility</button>
  <button data-tab="daily"><svg viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M9 3v18M17 3c-2 1-3 4-3 8h3v10"/></svg>Daily</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- storage (IndexedDB, one document) ---------- */
const DB = {
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('lift',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async set(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
};
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>DB.set('data',S).catch(e=>toast('Save failed: '+e.message)),150); }

/* ---------- seed data ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
function seedExercises(){
  const ex=(name,group,inv=false)=>({id:uid(),name,group,inv});
  return {
    apu:ex('Assisted pull-up','Back',true), neg:ex('Pull-up negatives','Back'), rdf:ex('Rear-delt flye','Shoulders'),
    bench:ex('Barbell bench press','Chest'), dbshoulder:ex('Seated dumbbell shoulder press','Shoulders'), incl:ex('Incline dumbbell press','Chest'),
    lat:ex('Lateral raise','Shoulders'), push:ex('Tricep pushdown','Arms'),
    dl:ex('Deadlift','Back'), pd:ex('Lat pulldown','Back'), csrow:ex('Chest-supported row','Back'), face:ex('Face pull','Shoulders'), curl:ex('EZ-bar curl','Arms'),
    sq:ex('Back squat','Legs'), rdl:ex('Romanian deadlift','Legs'), lp:ex('Leg press','Legs'), slc:ex('Seated leg curl','Legs'), calf:ex('Standing calf raise','Legs'),
    ohp:ex('Overhead press','Shoulders'), pullup:ex('Pull-up (weighted/assisted)','Back'), dbbench:ex('Dumbbell bench press','Chest'), dbrow:ex('Single-arm dumbbell row','Back'),
    fsq:ex('Front squat','Legs'), hip:ex('Hip thrust','Legs'), bss:ex('Bulgarian split squat','Legs'), llc:ex('Lying leg curl','Legs'), hlr:ex('Hanging leg raise','Core')
  };
}
function seedPrograms(E){
  const pe=(e,sets,reps,rest,ss=false)=>({exId:e.id,sets,reps,rest,ss});
  return [
    {id:uid(),name:'Push',color:'red',items:[pe(E.bench,4,8,150),pe(E.dbshoulder,3,10,120),pe(E.incl,3,12,90),pe(E.lat,3,15,60,true),pe(E.push,3,15,60)]},
    {id:uid(),name:'Pull',color:'blue',items:[pe(E.apu,4,8,150),pe(E.pd,3,10,120),pe(E.neg,3,4,120),pe(E.csrow,3,12,90),pe(E.rdf,3,15,60,true),pe(E.curl,3,12,60)]},
    {id:uid(),name:'Legs',color:'yellow',items:[pe(E.sq,4,8,180),pe(E.rdl,3,10,120),pe(E.lp,3,12,90),pe(E.slc,3,12,60),pe(E.calf,4,15,60)]},
    {id:uid(),name:'Upper',color:'green',items:[pe(E.ohp,4,8,150),pe(E.apu,3,8,150),pe(E.dbbench,3,10,90),pe(E.dbrow,3,12,90),pe(E.lat,3,15,60),pe(E.curl,2,12,60,true),pe(E.push,2,12,60)]},
    {id:uid(),name:'Lower',color:'purple',items:[pe(E.fsq,4,8,180),pe(E.hip,3,10,120),pe(E.bss,3,8,90),pe(E.llc,3,12,60),pe(E.hlr,3,15,60)]}
  ];
}
const SEED_VERSION=3;
/* Meal plan lives as plain text so it can be edited on the phone. Format:
   @targets P | C | F | kcal        daily targets
   # Meal name | flags              a meal. Flags: "train" = training days only, "alt" = swap option, "x2" = eaten twice
   Food | qty | P | C | F | kcal    one line per food
   > note text                      notes shown under the plan                                        */
const MEAL_PLAN_VERSION=4;
const MEAL_PLAN_TEXT=`@targets 175 | 140 | 60 | 1950
# Pre-workout: creamed rice + whey | train
Aunt Betty's Rice 2 Go Creamed Rice, vanilla | 1 pot (100 g) | 3.6 | 17.6 | 1.7 | 100
Whey protein, stirred into the rice | 1/2 scoop (19.5 g) | 10.5 | 5.7 | 1.15 | 77
# Shake
Whey protein, chocolate | 1 scoop (39 g) | 21 | 11.4 | 2.3 | 153
Oats, ground | 1 scoop (1/3 cup, ~30 g) | 3.5 | 17.7 | 2.6 | 112
Chia seeds | 1/2 tbsp (7.5 g) | 1.25 | 3 | 2.25 | 36
Milk, standard | 250 ml | 8 | 12 | 8 | 148
# Egg breakfast (instead of the shake) | alt
Eggs, size 7, no oil | 3 | 20.8 | 1.2 | 15.7 | 236
Vogel's Original Mixed Grain toast | 2 slices (88 g) | 8.5 | 30.5 | 1.2 | 177
Whey in water | 1/2 scoop (19.5 g) | 10.5 | 5.7 | 1.15 | 77
# Lunch: rotisserie chicken noodles
High Mark Egg Noodles Round, cooked | 150 g (1/4 of 280 g pack) | 7.2 | 40 | 0.5 | 200
Rotisserie chicken, no skin or bones | ~168 g (1/4 of 670 g meat) | 48.6 | 0 | 12.4 | 319
Bertolli oil spray, extra light | 2 sprays | 0 | 0 | 2.8 | 24
Wattie's Chinese stir-fry veg + onion | 150 g + 1 medium onion | 3.9 | 17.2 | 0.4 | 95
Sauce: oyster, reduced-salt soy, sesame oil, stock | 1 tbsp, 1 tbsp, 1 tsp, 125 ml | 1.9 | 5.5 | 4.7 | 75
# Dinner: mince, roast veg, yoghurt
Beef mince 18%, browned and drained | ~168 g cooked (1/4 of 670 g from 1 kg raw) | 45.8 | 0 | 28.4 | 439
Anchor Protein Plus Yoghurt, plain | 90 g (1/2 serve) | 7.4 | 2.2 | 1.7 | 54
Roast veg tray (pumpkin, kumara, potato) | 300 g raw (1/4 of 1.2 kg tray) | 4.7 | 43.3 | 0.4 | 199
Bertolli oil spray for roasting | 5 sprays per tray, 1/4 share | 0 | 0 | 1.75 | 15
> Batch cook every 4 days: 1 rotisserie chicken (skin and bones off, ~670 g meat), 1 kg mince (~670 g cooked), 1 noodle pack, 1 roast veg tray. Split each into 4.
> Mince: brown in a non-stick pan and pour off the fat.
> Roast veg: 1.2 kg seasoned tray + 5 sprays of oil, roast, split into 4 dinners.
> Shake packs dry (whey + oats + chia); pour 250 ml milk at work. 3 meals only, no snacks.
> Egg breakfast is ~40 kcal more than the shake; best on rest days.
> Oil spray: 1 spray = 1.5 ml = 12 kcal, so count them.
> Unlimited: water, black coffee, tea, diet drinks, extra green veg.
> Adjust: losing over 1.1 kg/wk after week 2, add 100-150 kcal carbs. Under 0.5 kg/wk two weeks running, split the veg tray 5 ways or lengthen the walks.
> Supplements: creatine 5 g, Centrum, MitoQ omega, MitoQ Triple Magnesium before bed.`;
function parseMealPlan(text){
  const plan={targets:null,meals:[],notes:[]}; let cur=null; const num=x=>{ const v=parseFloat(String(x).replace(/,/g,'')); return isNaN(v)?0:v; };
  for(const raw of String(text||'').split('\n')){ const line=raw.trim(); if(!line) continue;
    if(line.startsWith('@targets')){ const p=line.slice(8).split('|').map(num); plan.targets={p:p[0],c:p[1],f:p[2],kcal:p[3]}; continue; }
    if(line.startsWith('#')){ const parts=line.slice(1).split('|').map(x=>x.trim()); const flags=parts.slice(1).map(x=>x.toLowerCase());
      const mult=flags.map(f=>/^x(\d+)$/.exec(f)).find(Boolean); cur={name:parts[0],mult:mult?+mult[1]:1,alt:flags.includes('alt'),train:flags.includes('train'),foods:[]}; plan.meals.push(cur); continue; }
    if(line.startsWith('>')){ plan.notes.push(line.slice(1).trim()); continue; }
    if(line.includes('|')){ const c=line.split('|').map(x=>x.trim()); if(!cur){ cur={name:'Meal',mult:1,alt:false,train:false,foods:[]}; plan.meals.push(cur); }
      cur.foods.push({name:c[0],qty:c[1]||'',p:num(c[2]),c:num(c[3]),f:num(c[4]),kcal:num(c[5])}); }
  }
  for(const m of plan.meals){ m.tot=m.foods.reduce((a,x)=>({p:a.p+x.p,c:a.c+x.c,f:a.f+x.f,kcal:a.kcal+x.kcal}),{p:0,c:0,f:0,kcal:0}); }
  const sum=ms=>ms.reduce((a,m)=>({p:a.p+m.tot.p*m.mult,c:a.c+m.tot.c*m.mult,f:a.f+m.tot.f*m.mult,kcal:a.kcal+m.tot.kcal*m.mult}),{p:0,c:0,f:0,kcal:0});
  plan.day=sum(plan.meals.filter(m=>!m.alt));               // training day (everything except swaps)
  plan.rest=sum(plan.meals.filter(m=>!m.alt&&!m.train));    // rest day (no training-only meals)
  plan.hasTrain=plan.meals.some(m=>m.train&&!m.alt);
  return plan;
}

    settings:{defaultRest:90,autoRest:true}, mealPlan:MEAL_PLAN_TEXT, mealPlanVersion:MEAL_PLAN_VERSION, days:{}, lastExport:null };
}
// Load the built-in 5-day split into an existing store, reusing exercises that already exist by name
function loadBuiltInPrograms(){

  const progs=seedPrograms(E);
  for(const p of progs){ const i=S.programs.findIndex(x=>x.name.toLowerCase()===p.name.toLowerCase()); if(i>=0) S.programs[i]={...p,id:S.programs[i].id}; else S.programs.push(p); }

}
function migrate(){

function setsFor(exId,excludeActive=true){

function lastSessionSets(exId){ for(let i=S.sessions.length-1;i>=0;i--){ const st=S.sessions[i].sets.filter(x=>x.exId===exId); if(st.length) return st; } return null; }
function bests(exId){
  const sets=setsFor(exId); const inv=!!exById(exId)?.inv; let w=inv?Infinity:0,e=0,maxReps=0; const reps={};
  for(const s of sets){ if(inv?s.weight<w:s.weight>w) w=s.weight; const v=e1rm(s.weight,s.reps); if(v>e) e=v; if(s.reps>maxReps) maxReps=s.reps;
    if(reps[s.reps]===undefined||(inv?s.weight<reps[s.reps]:s.weight>reps[s.reps])) reps[s.reps]=s.weight; }
  return {weight:sets.length?w:0,e1rm:e,reps,maxReps,count:sets.length,inv};
}
function checkPR(exId,weight,reps){
  const b=bests(exId); const flags=[];
  if(b.count===0) return flags;
  if(b.inv){ if(weight<b.weight) flags.push('Least assistance'); if(reps>b.maxReps) flags.push('Most reps');
    if(!flags.length && (b.reps[reps]===undefined||weight<b.reps[reps])) flags.push(reps+'-rep'); return flags; }

}

/* ---------- charts (hand drawn, offline) ---------- */
const GROUP_COLORS={Chest:'#D9403F',Back:'#2E6FDB',Legs:'#F1C232',Shoulders:'#3FB56B',Arms:'#B067E3',Core:'#4FC3D9',Other:'#9AA2AF'};
function weeklyVolume(){
  const now=Date.now(), wk=7*864e5, weeks=[]; const start=now-11*wk;
  for(let i=0;i<12;i++) weeks.push({}); 
  for(const s of S.sessions){ if(s.date<start-wk) continue; const i=Math.min(11,Math.max(0,Math.floor((s.date-start)/wk)));
    for(const st of s.sets){ const g=exById(st.exId)?.group||'Other'; const k=GROUP_COLORS[g]?g:'Other'; weeks[i][k]=(weeks[i][k]||0)+st.weight*st.reps; } }
  return weeks;
}
function setupCanvas(c){ const dpr=window.devicePixelRatio||1; const w=c.clientWidth||300,h=c.clientHeight||150; c.width=w*dpr; c.height=h*dpr; const g=c.getContext('2d'); g.scale(dpr,dpr); return {g,w,h}; }
function drawChart(c){
  const {g,w,h}=setupCanvas(c); const pad={l:40,r:8,t:8,b:22};
  g.font='12px -apple-system,Helvetica,sans-serif'; g.fillStyle='#9AA2AF'; g.strokeStyle='#434955';
  if(c.dataset.chart==='pain'){ drawPain(c); return; }
  if(c.dataset.chart==='weekly'){
    const weeks=weeklyVolume(); const tot=weeks.map(wk=>Object.values(wk).reduce((a,b)=>a+b,0)); const max=Math.max(1,...tot);
    const bw=(w-pad.l-pad.r)/12; grid(g,w,h,pad,max,3);
    weeks.forEach((wk,i)=>{ let y=h-pad.b; const x=pad.l+i*bw+3;
      for(const [gname,v] of Object.entries(wk)){ const bh=(v/max)*(h-pad.t-pad.b); g.fillStyle=GROUP_COLORS[gname]; g.fillRect(x,y-bh,bw-6,bh); y-=bh; } });
    g.fillStyle='#9AA2AF'; g.textAlign='left'; g.fillText('11 wks ago',pad.l,h-6); g.textAlign='right'; g.fillText('this week',w-pad.r,h-6); return;
  }
  if(c.dataset.chart==='weight'){
    const pts=weightSeries(c.dataset.key); if(pts.length<2) return; const vals=pts.flatMap(p=>[p.w,p.avg].filter(Boolean));
    const max=Math.max(...vals), min=Math.min(...vals); const span=Math.max(0.5,max-min); const lo=min-span*0.15, hi=max+span*0.15;
    gridW(g,w,h,pad,lo,hi,3);
    const t0=keyDate(addDays(c.dataset.key,-27)).getTime(), t1=keyDate(c.dataset.key).getTime();
    const X=p=>pad.l+((keyDate(p.key).getTime()-t0)/Math.max(1,t1-t0))*(w-pad.l-pad.r), Y=v=>h-pad.b-((v-lo)/(hi-lo))*(h-pad.t-pad.b);
    g.fillStyle='#9AA2AF'; pts.forEach(p=>{ g.beginPath(); g.arc(X(p),Y(p.w),3,0,7); g.fill(); });
    g.strokeStyle='#F1C232'; g.lineWidth=2.5; g.lineJoin='round'; g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(X(p),Y(p.avg)):g.moveTo(X(p),Y(p.avg))); g.stroke();
    g.fillStyle='#9AA2AF'; g.textAlign='left'; g.fillText('4 wks ago',pad.l,h-6); g.textAlign='right'; g.fillText(c.dataset.key===todayKey()?'today':fmtKey(c.dataset.key),w-pad.r,h-6); return;
  }
  const pts=perSession(c.dataset.id); const key=c.dataset.chart; const ys=pts.map(p=>p[key]); if(!ys.length) return;
  const max=Math.max(...ys), min=key==='vol'?0:Math.min(...ys); const span=Math.max(1,max-min); const lo=(key==='vol'||key==='reps')?0:min-span*0.15, hi=max+span*0.15;
  grid(g,w,h,pad,hi,3,lo);
  const X=i=>pad.l+(pts.length===1?0.5:i/(pts.length-1))*(w-pad.l-pad.r), Y=v=>h-pad.b-((v-lo)/(hi-lo))*(h-pad.t-pad.b);
  g.strokeStyle='#F1C232'; g.lineWidth=2.5; g.lineJoin='round'; g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(X(i),Y(p[key])):g.moveTo(X(i),Y(p[key]))); g.stroke();
  g.fillStyle='#F1C232'; pts.forEach((p,i)=>{ g.beginPath(); g.arc(X(i),Y(p[key]),3.5,0,7); g.fill(); });
  g.fillStyle='#9AA2AF'; g.textAlign='left'; g.fillText(fmtDate(pts[0].date),pad.l,h-6);
  if(pts.length>1){ g.textAlign='right'; g.fillText(fmtDate(pts[pts.length-1].date),w-pad.r,h-6); }
}
function gridW(g,w,h,pad,lo,hi,n){ g.textAlign='right'; g.lineWidth=1; for(let i=0;i<=n;i++){ const v=lo+(hi-lo)*i/n; const y=h-pad.b-(i/n)*(h-pad.t-pad.b);
  g.strokeStyle='#434955'; g.beginPath(); g.moveTo(pad.l,y); g.lineTo(w-pad.r,y); g.stroke(); g.fillStyle='#9AA2AF'; g.fillText(v.toFixed(1),pad.l-6,y+4); } }
function grid(g,w,h,pad,hi,n,lo=0){ g.textAlign='right'; g.lineWidth=1; for(let i=0;i<=n;i++){ const v=lo+(hi-lo)*i/n; const y=h-pad.b-(i/n)*(h-pad.t-pad.b);
  g.strokeStyle='#434955'; g.beginPath(); g.moveTo(pad.l,y); g.lineTo(w-pad.r,y); g.stroke(); g.fillStyle='#9AA2AF'; g.fillText(v>=1000?(v/1000).toFixed(1).replace('.0','')+'k':Math.round(v),pad.l-6,y+4); } }

/* ---------- rest timer ---------- */
const timer={on:false,end:0,total:0,iv:null,label:''};
let audioCtx=null;
function beep(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime;
  [0,0.18,0.36].forEach((d,i)=>{ const o=audioCtx.createOscillator(), gn=audioCtx.createGain(); o.type='sine'; o.frequency.value=i===2?1320:880; gn.gain.setValueAtTime(0.0001,t+d); gn.gain.exponentialRampToValueAtTime(0.5,t+d+0.01); gn.gain.exponentialRampToValueAtTime(0.0001,t+d+0.15); o.connect(gn).connect(audioCtx.destination); o.start(t+d); o.stop(t+d+0.16); }); }catch(e){} }
function primeAudio(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function startRest(sec,label){ timer.on=true; timer.total=sec; timer.end=Date.now()+sec*1000; timer.label=label; timer.fired=false; $('#timer').classList.add('on'); app.classList.add('with-timer'); clearInterval(timer.iv); timer.iv=setInterval(tick,250); tick(); }
function stopRest(){ timer.on=false; clearInterval(timer.iv); $('#timer').classList.remove('on'); app.classList.remove('with-timer'); }
function tick(){ const left=Math.ceil((timer.end-Date.now())/1000); const t=$('#timer-t'); const a=Math.abs(left);
  t.textContent=(left<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0'); t.classList.toggle('over',left<=0);
  $('#timer-label').textContent=left>0?'Rest · '+timer.label:'Go · '+timer.label;
  $('#timer-bar').style.width=Math.max(0,Math.min(100,left/timer.total*100))+'%';
  if(left<=0&&!timer.fired){ timer.fired=true; beep(); if(navigator.vibrate) navigator.vibrate([200,100,200]); }
  if(left<=-60) stopRest(); }

/* ---------- wake lock ---------- */
let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&(S?.active||S?.mobility?.active)) keepAwake(); if(timer.on) tick(); if(mobIv) mobTick(); });

/* ---------- actions ---------- */
function startWorkout(prog){
  const items=(prog?prog.items:[]).map(it=>({exId:it.exId,reps:it.reps,rest:it.rest,ss:it.ss,sets:Array.from({length:it.sets},()=>({weight:null,reps:null,done:false}))}));
  S.active={id:uid(),programId:prog?.id||null,name:prog?.name||'Workout',date:Date.now(),start:Date.now(),items,cardio:{type:S.cardioOptions[0]}};
  save(); primeAudio(); keepAwake(); go('workout');
}
function finishWorkout(){
  const a=S.active; const sets=[]; a.items.forEach(it=>it.sets.forEach(st=>{ if(st.done&&st.weight>=0&&st.reps>0) sets.push({exId:it.exId,weight:st.weight,reps:st.reps}); }));
  if(!sets.length&&!a.cardio.minutes){ if(!confirm('Nothing logged. Finish anyway?')) return; }
  const cardio=(a.cardio.type==='__none'||!(a.cardio.minutes||a.cardio.kcal))?null:a.cardio;
  let end=Date.now();
  if(end-a.start>4*3600e3){ const m=parseInt(prompt('This workout has been open for '+Math.round((end-a.start)/3600e3)+' hours. How many minutes did it actually take?','75'),10); if(m>0) end=a.start+m*60000; }
  S.sessions.push({id:a.id,programId:a.programId,name:a.name,date:a.date,start:a.start,end,sets,cardio,note:(a.note||'').trim()||null});
  if(a.programId){ const idx=S.programs.findIndex(p=>p.id===a.programId); if(idx>=0) S.rotation=idx+1; }
  S.active=null; stopRest(); if(wake) wake.release?.(); save(); history_=[]; go('session',{id:a.id},false); toast('Workout saved');
}
/* ---------- editing a logged workout ---------- */
let ED=null; // draft: {id,name,start,minutes,items:[{exId,sets:[{weight,reps}]}],cardio}
function openEdit(id){
  const s=S.sessions.find(x=>x.id===id); if(!s) return;
  const items=[]; for(const st of s.sets){ let it=items[items.length-1]; if(!it||it.exId!==st.exId){ it={exId:st.exId,sets:[]}; items.push(it); } it.sets.push({weight:st.weight,reps:st.reps}); }
  ED={id:s.id,name:s.name,start:s.start||s.date,minutes:s.end?Math.round((s.end-(s.start||s.date))/60000):null,items,cardio:Object.assign({type:S.cardioOptions[0]},s.cardio||{type:'__none'}),dateStr:null,timeStr:null,note:s.note||''};
  if(!s.cardio) ED.cardio.type='__none';
  go('editsession',{id});
}
function saveEdit(){
  const d=ED; const s=S.sessions.find(x=>x.id===d.id); if(!s){ ED=null; back(); return; }
  let start=d.start; if(d.dateStr||d.timeStr){ const cur=new Date(d.start); const pad2=n=>String(n).padStart(2,'0');
    const ds=d.dateStr||`${cur.getFullYear()}-${pad2(cur.getMonth()+1)}-${pad2(cur.getDate())}`, ts=d.timeStr||`${pad2(cur.getHours())}:${pad2(cur.getMinutes())}`;
    const t=new Date(ds+'T'+ts+':00').getTime(); if(!isNaN(t)) start=t; }
  const sets=[]; d.items.forEach(it=>it.sets.forEach(st=>{ if(st.weight>=0&&st.reps>0&&st.weight!==null) sets.push({exId:it.exId,weight:st.weight,reps:st.reps}); }));
  s.name=d.name.trim()||s.name; s.start=start; s.date=start; s.end=d.minutes>0?start+d.minutes*60000:null; s.sets=sets;
  s.cardio=(d.cardio.type==='__none'||!(d.cardio.minutes||d.cardio.kcal))?null:{type:d.cardio.type,minutes:d.cardio.minutes??null,level:d.cardio.level??null,kcal:d.cardio.kcal??null};
  s.note=(d.note||'').trim()||null;
  S.sessions.sort((a,b)=>a.date-b.date); ED=null; save(); history_=[]; go('session',{id:s.id},false); toast('Workout updated');
}
function mergeExercise(fromId){
  const from=exById(fromId); const names=S.exercises.filter(e=>e.id!==fromId).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const s=prompt('Merge "'+from.name+'" into which exercise? All its logged sets and program slots move across, then it is deleted.\n'+names.map(e=>e.name).join(', ')); if(!s) return;
  const to=names.find(e=>e.name.toLowerCase()===s.trim().toLowerCase()); if(!to){ toast('No exercise called that'); return; }
  if(!confirm(`Merge ${from.name} → ${to.name}?`)) return;
  for(const ses of S.sessions) for(const st of ses.sets) if(st.exId===fromId) st.exId=to.id;
  for(const p of S.programs) for(const it of p.items) if(it.exId===fromId) it.exId=to.id;
  if(S.active) for(const it of S.active.items) if(it.exId===fromId) it.exId=to.id;
  S.exercises=S.exercises.filter(e=>e.id!==fromId); save(); render(); toast('Merged into '+to.name);
}

function toggleSet(ii,si){
  const a=S.active, it=a.items[ii], st=it.sets[si];
  if(st.done){ st.done=false; it.pr=null; save(); render(); return; }
  const wIn=app.querySelector(`input[data-f="weight"][data-ii="${ii}"][data-si="${si}"]`);
  const rIn=app.querySelector(`input[data-f="reps"][data-ii="${ii}"][data-si="${si}"]`);
  const w=parseFloat(wIn.value||wIn.placeholder), r=parseInt(rIn.value||rIn.placeholder,10);
  if(!(w>=0)||!(r>0)){ toast('Enter weight and reps'); return; }
  st.weight=w; st.reps=r; st.done=true;
  const pr=checkPR(it.exId,w,r); if(pr.length){ it.pr=`PR: ${pr.join(', ')} — ${fmtKg(w)} × ${r}`; }
  // rest: skip if this exercise supersets into the next one
  const paired=it.ss&&a.items[ii+1]; if(!paired&&S.settings.autoRest) startRest(it.rest||S.settings.defaultRest,exById(it.exId)?.name||'');
  // prefill next set
  const nx=it.sets[si+1]; if(nx&&!nx.done&&nx.weight==null){ nx.weight=w; nx.reps=r; }
  save(); render();
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function pickExercise(cb){ const names=S.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name)); const s=prompt('Exercise name (type a new one to create it):\n'+names.map(e=>e.name).join(', ')); if(!s) return;
  let e=S.exercises.find(x=>x.name.toLowerCase()===s.trim().toLowerCase()); if(!e){ const gsel=prompt('Muscle group (Chest, Back, Legs, Shoulders, Arms, Core, Other)','Other')||'Other'; e={id:uid(),name:s.trim(),group:gsel}; S.exercises.push(e); } cb(e); }
function download(name,text){ const b=new Blob([text],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }

    'ex-up':()=>{ const it=S.active.items, i=+b.dataset.ii; if(i>0){ [it[i-1],it[i]]=[it[i],it[i-1]]; save(); render(); } },

    'eds-add-ex':()=>pickExercise(ex=>{ ED.items.push({exId:ex.id,sets:[{weight:null,reps:null}]}); save(); render(); }),
    'edit-meals':()=>go('mealedit'),
    'open-plan':()=>go('meals'),
    'day-prev':()=>{ route.date=addDays(route.date||todayKey(),-1); render(); },
    'day-next':()=>{ const k=addDays(route.date||todayKey(),1); if(k<=todayKey()){ route.date=k; render(); } },
    'tick-meal':()=>{ const plan=parseMealPlan(S.mealPlan); const m=plan.meals[+b.dataset.i]; if(!m) return; const d=dayObj(route.date||todayKey());
      if(d.meals[m.name]) delete d.meals[m.name]; else d.meals[m.name]={p:r1(m.tot.p*m.mult),c:r1(m.tot.c*m.mult),f:r1(m.tot.f*m.mult),kcal:Math.round(m.tot.kcal*m.mult)};
      save(); render(); },
    'day-plan':()=>{ const key=route.date||todayKey(); const plan=parseMealPlan(S.mealPlan); const d=dayObj(key); const train=d.train!=null?d.train:trainedOn(key);
      for(const m of plan.meals){ if(m.alt||(m.train&&!train)) continue; d.meals[m.name]={p:r1(m.tot.p*m.mult),c:r1(m.tot.c*m.mult),f:r1(m.tot.f*m.mult),kcal:Math.round(m.tot.kcal*m.mult)}; }
      save(); render(); toast('Meals ticked'); },
    'reset-meals':()=>{ if(confirm('Replace your meal plan with the built-in one?')){ S.mealPlan=MEAL_PLAN_TEXT; save(); render(); } },
    'merge-ex':()=>mergeExercise(id),
    finish:finishWorkout,
    'cancel-workout':()=>{ if(confirm('Discard this workout? Nothing will be saved.')){ S.active=null; stopRest(); save(); history_=[]; go('home',{},false); } },
    'timer-adj':()=>{ timer.end+=(+b.dataset.v)*1000; timer.total=Math.max(1,timer.total+(+b.dataset.v)); tick(); },
    'timer-stop':stopRest,
    'rest-now':()=>{ const it=S.active.items[+b.dataset.ii]; primeAudio(); startRest(it.rest||S.settings.defaultRest,exById(it.exId)?.name||''); },
    'load-builtin':()=>{ if(confirm('Replace the built-in programs with the 5-day split? Your own programs and all history are kept.')){ loadBuiltInPrograms(); save(); render(); toast('Programs loaded'); } },

    'del-session':()=>{ if(confirm('Delete this workout?')){ S.sessions=S.sessions.filter(s=>s.id!==id); save(); history_=[]; go('history',{},false); } },
    'edit-prog':()=>go('editor',{id}),
    'new-prog':()=>{ const p={id:uid(),name:'New program',color:'green',items:[]}; S.programs.push(p); save(); go('editor',{id:p.id}); },
    'del-prog':()=>{ const p=progById(route.id); if(confirm(`Delete ${p.name}?`)){ S.programs=S.programs.filter(x=>x.id!==p.id); S.rotation=0; save(); back(); } },
    'prog-color':()=>{ progById(route.id).color=b.dataset.c; save(); render(); },
    'ed-up':()=>{ const p=progById(route.id), i=+b.dataset.i; [p.items[i-1],p.items[i]]=[p.items[i],p.items[i-1]]; save(); render(); },

    exlist:()=>go('exlist'),
    'new-ex':()=>pickExercise(()=>{ save(); render(); }),
    'rename-ex':()=>{ const ex=exById(id); const n=prompt('Exercise name',ex.name); if(n===null) return; const g=prompt('Muscle group (Chest, Back, Legs, Shoulders, Arms, Core, Other)',ex.group); ex.name=n.trim()||ex.name; ex.group=(g||ex.group).trim(); ex.inv=confirm('Is a LOWER weight better for this exercise (e.g. assisted pull-up)? OK = yes, Cancel = no'); save(); render(); },
    'del-ex':()=>{ const used=S.sessions.some(s=>s.sets.some(x=>x.exId===id))||S.programs.some(p=>p.items.some(x=>x.exId===id)); if(used){ toast('In use by a program or logged workout'); return; } if(confirm('Delete exercise?')){ S.exercises=S.exercises.filter(x=>x.id!==id); save(); render(); } },
    rotate:()=>{ S.rotation++; save(); render(); },

    import:()=>$('#importfile').click(),
    reset:()=>{ if(confirm('Delete all programs, exercises and history on this phone?')&&confirm('Really? Export a backup first if you want one.')){ S=seed(); save(); history_=[]; go('home',{},false); } }
  };
  acts[A]?.();

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('#importfile')){ const f=t.files[0]; if(!f) return; f.text().then(txt=>{ const d=JSON.parse(txt); if(!d.exercises||!d.programs||!d.sessions) throw new Error('not a Lift backup'); S=d; migrate(); save(); history_=[]; go('home',{},false); toast('Backup imported'); }).catch(err=>toast('Import failed: '+err.message)); t.value=''; return; }
  if(t.dataset.f){ const st=S.active.items[+t.dataset.ii].sets[+t.dataset.si]; const v=parseFloat(t.value); st[t.dataset.f]=isNaN(v)?null:v; save(); return; }
  if(ED){
    if(t.dataset.eds){ const k=t.dataset.eds; if(k==='date') ED.dateStr=t.value; else if(k==='time') ED.timeStr=t.value; else if(k==='minutes'){ const v=parseInt(t.value,10); ED.minutes=v>0?v:null; } else ED.name=t.value; return; }
    if(t.dataset.edsEx!==undefined){ ED.items[+t.dataset.edsEx].exId=t.value; return; }
    if(t.dataset.edsSet){ const st=ED.items[+t.dataset.ii].sets[+t.dataset.si]; const v=parseFloat(t.value); st[t.dataset.edsSet]=isNaN(v)?null:v; return; }
    if(t.hasAttribute('data-eds-cardio-type')){ ED.cardio.type=t.value; render(); return; }
    if(t.dataset.edsCardio){ const v=parseFloat(t.value); ED.cardio[t.dataset.edsCardio]=isNaN(v)?null:v; return; }
    if(t.hasAttribute('data-eds-note')){ ED.note=t.value; return; }
  }
  if(t.hasAttribute('data-mealplan')){ S.mealPlan=t.value; save(); return; }
  if(t.hasAttribute('data-dayweight')){ const d=dayObj(route.date||todayKey()); const v=parseFloat(t.value); d.weight=v>0?Math.round(v*10)/10:null; save(); render(); return; }
  if(t.hasAttribute('data-daytrain')){ const key=route.date||todayKey(); const d=dayObj(key); d.train=t.checked; save(); render(); return; }
  if(t.hasAttribute('data-cardio-type')){ S.active.cardio.type=t.value; save(); render(); return; }
  if(t.dataset.cardio){ const v=parseFloat(t.value); S.active.cardio[t.dataset.cardio]=isNaN(v)?null:v; save(); return; }
  if(t.dataset.settingList){ const arr=t.value.split(',').map(x=>x.trim()).filter(Boolean); if(arr.length){ S[t.dataset.settingList]=arr; S.cardioName=arr[0]; } save(); render(); return; }
  if(t.dataset.settingNum){ const v=parseInt(t.value,10); if(v>=0) S.settings[t.dataset.settingNum]=v; save(); return; }
  if(t.dataset.settingBool){ S.settings[t.dataset.settingBool]=t.checked; save(); return; }
  if(t.dataset.setting){ S[t.dataset.setting]=t.value.trim()||S[t.dataset.setting]; save(); return; }
  if(t.dataset.prog){ const p=progById(route.id); p[t.dataset.prog]=t.value.trim()||p[t.dataset.prog]; save(); return; }
  if(t.dataset.ed){ const it=progById(route.id).items[+t.dataset.i]; const k=t.dataset.ed;
    if(k==='ss') it.ss=t.checked; else if(k==='exId') it.exId=t.value; else it[k]=Math.max(k==='rest'?0:1,parseInt(t.value,10)||0); save(); if(k==='exId'||k==='ss') render(); }
});
document.addEventListener('input',e=>{ const t=e.target;
  if(t.hasAttribute('data-mealplan')){ S.mealPlan=t.value; save(); }

/* ---------- exercise diagrams: posed stick figures drawn as inline SVG ---------- */
// Angles are degrees, clockwise from +x (0 right, 90 down, 180 left, -90 up). Frame is 160 x 120, floor at y 104 unless set.
const VL={torso:34,ua:19,fa:17,th:27,sh:26,hr:7,ft:9};
const vrad=a=>a*Math.PI/180;
const vpt=(o,a,l)=>[o[0]+Math.cos(vrad(a))*l,o[1]+Math.sin(vrad(a))*l];
const vr=n=>Math.round(n*10)/10;
const vP=p=>vr(p[0])+','+vr(p[1]);
function vfig(p){
  const hip=p.hip, nk=vpt(hip,p.torso,VL.torso), sh=vpt(hip,p.torso,VL.torso-4), hd=vpt(nk,p.torso+(p.headA||0),VL.hr+5);
  const leg=(L,cls)=>{ if(!L) return ''; const k=vpt(hip,L[0],VL.th), a=vpt(k,L[1],VL.sh), f=vpt(a,L[2]==null?L[1]-90:L[2],VL.ft); return `<path class="${cls}" d="M${vP(hip)}L${vP(k)}L${vP(a)}L${vP(f)}"/>`; };
  const arm=(A,cls)=>{ if(!A) return ''; const e=vpt(sh,A[0],VL.ua), w=vpt(e,A[1],VL.fa); return `<path class="${cls}" d="M${vP(sh)}L${vP(e)}L${vP(w)}"/>`; };
  const torso=p.bow?(()=>{ const m=[(hip[0]+nk[0])/2,(hip[1]+nk[1])/2]; const c=vpt(m,p.torso-90,p.bow); return `<path class="near" d="M${vP(hip)}Q${vP(c)} ${vP(nk)}"/>`; })():`<path class="near" d="M${vP(hip)}L${vP(nk)}"/>`;
  return leg(p.legs&&p.legs[1],'far')+arm(p.arms&&p.arms[1],'far')+torso+`<circle class="head" cx="${vr(hd[0])}" cy="${vr(hd[1])}" r="${VL.hr}"/>`+leg(p.legs&&p.legs[0],'near')+arm(p.arms&&p.arms[0],'near');
}
function vprops(list){ return (list||[]).map(q=>{ const t=q[0];
  if(t==='floor') return `<line class="prop" x1="6" y1="${q[1]||104}" x2="154" y2="${q[1]||104}"/>`;
  if(t==='wall') return `<line class="prop" x1="${q[1]}" y1="${q[2]||14}" x2="${q[1]}" y2="${q[3]||104}"/>`;
  if(t==='box') return `<rect class="box" x="${q[1]}" y="${q[2]}" width="${q[3]}" height="${q[4]}" rx="3"/>`;
  if(t==='towel') return `<rect class="towel" x="${q[1]-7}" y="${q[2]-3}" width="14" height="6" rx="3"/>`;
  if(t==='band') return `<path class="band" d="M${q[1]}L${q[2]}"/>`;
  if(t==='loop') return `<ellipse class="band" cx="${q[1]}" cy="${q[2]}" rx="${q[3]||6}" ry="3"/>`;
  if(t==='focus') return `<circle class="focus" cx="${q[1]}" cy="${q[2]}" r="${q[3]||9}"/>`;
  if(t==='arrow') return `<path class="arrow" d="M${q[1]},${q[2]}${q[5]?`Q${q[5]},${q[6]} `:'L'}${q[3]},${q[4]}" marker-end="url(#vah)"/>`;
  if(t==='text') return `<text class="vt" x="${q[1]}" y="${q[2]}" ${q[4]?`text-anchor="${q[4]}"`:''}>${q[3]}</text>`;
  if(t==='ball') return `<circle class="box" cx="${q[1]}" cy="${q[2]}" r="4"/>`;
  return ''; }).join(''); }
function vframe(f){ f={...f,props:(f.props||[]).filter(q=>!(q[0]==='text'&&q[2]<=16))}; const floor=f.floor===null?'':`<line class="prop" x1="6" y1="${f.floor||104}" x2="154" y2="${f.floor||104}"/>`; const s=f.scale||1, dx=f.dx||0, dy=f.dy||0;
  return `<g transform="translate(${dx},${dy}) scale(${s})">${floor}${vprops(f.props)}${f.pose?vfig(f.pose):''}${vprops(f.over)}</g>`; }
function vsvg(v){ if(!v) return ''; const frames=v.frames||[v]; const w=160*frames.length;
  const caps=frames.map(f=>(f.props||[]).filter(q=>q[0]==='text'&&q[2]<=16).map(q=>q[3]).join(' ')).filter(Boolean);

const MOB_FINDINGS=[
  'Back pain sits at the SI joint (back dimples) and only shows up when the pelvis has to be held still: crunches, leg lifts, split squats, single-leg bridge. No nerve signs. That is a control problem, not a spine problem.',
  'Left glute barely switches on; the back takes over. Left side is the weaker, more painful side, so it always goes first and gets the extra set.',
  'Hip flexors and front of thigh are short (positive Thomas test), which is what 8 hours of sitting does.',
  'Squat test: heels lift (stiff ankles), knees drift in (weak outer hips), back tucks at the bottom (stiff hips). The knees-in part is why the inside of the knee hurts on split squats.',
  'Right shoulder pinches and clicks at the top of a reach, at the bottom of a press, and reaching across or behind: rounded-shoulder impingement pattern. Chest and lats tight, upper back stiff, shoulder blade not rotating up.'
];
const MOB_GYM=[
  'For 4 to 6 weeks swap hanging leg raises and any crunch or leg-lift work for dead bugs or a Pallof press.',
  'Bulgarian split squats: pause them, or shorten the range and hold a wall, until the inside of the knee is quiet. Hip thrusts, leg press and goblet squats stay.',
  'Bench: dumbbells with a neutral grip, or stop the bar a fist above the chest. No deep dips for now. Incline over flat.',
  'Overhead press: landmine press or neutral-grip dumbbell press to the height that does not pinch, 10 to 20 percent lighter, slow on the way down.',
  'Keep rows, pulldowns, pull-ups and rear-delt work: they help the shoulder. If the shoulder clicks in the dead hang, use a partial hang.',
  'Pain rule: up to 3 out of 10 during a set is acceptable if it settles by the next morning. More than that, cut the range or the load, not the exercise.',
  'Evening work this light does not hurt sleep. Finish at least 30 minutes before bed and keep it slow.'
];

  hipflex:{name:'Hip flexor stretch',block:'Loosen',vis:['hipflex'],kitVis:['hipflex','couch'],dose:{type:'time',sets:2,secs:30,sides:true},why:'Your Thomas test was positive. The pelvic tuck is what makes this version work; arching the back makes it useless.',cues:['Half-kneel: one knee down on a cushion, other foot forward, torso tall','Squeeze the bum on the kneeling side and tuck the tailbone under. You should feel the front of that hip already','Only now shift forward a few centimetres. The lower back stays long, never arched','Stop short of any pinch in the front of the hip or the lower back'],kitCues:['Mat under the knee makes 30 s comfortable','Half-kneel, squeeze the bum on the kneeling side, tuck the tailbone under','Shift forward a few centimetres with the back long','From week 3, finish with a 30 s couch stretch: rear foot up on the couch, same tuck, only if the knee is happy']},
  fig4:{name:'Figure-4 glute stretch',block:'Loosen',vis:['fig4'],dose:{type:'time',sets:1,secs:45,sides:true},why:'Loosens the deep hip rotators that lock up with sitting. Chosen over pigeon because it keeps the pelvis level, which the left SI joint will prefer.',cues:['On your back, cross one ankle over the other knee','Reach through and pull the bottom thigh towards you until the crossed-side bum stretches','Head and lower back stay on the floor; push the crossed knee gently away with the elbow','Breathe slowly. Ease off if it is the SI area, not the bum, that you feel']},
  pec:{name:'Doorway chest stretch',block:'Loosen',vis:['pec'],dose:{type:'time',sets:1,secs:40},why:'Tight pecs pull the shoulders forward and tip the shoulder blade so the joint pinches at the top of a reach.',cues:['Forearms on each side of a door frame, elbows a little below shoulder height','Step one foot through until the front of the chest stretches, ribs down, no arching','Shoulders down away from the ears. Stop before any pinch at the front of the shoulder','Change the lead foot halfway through']},
  er:{name:'Shoulder external rotation',block:'Activate',vis:['er'],kitVis:['erband'],dose:{type:'reps',sets:1,reps:15,sides:true},why:'The rotator cuff holds the ball of the joint down and back. It is the exercise the shoulder-pain trials lean on most.',cues:['Lie on your side, top elbow pinned to your ribs and bent to 90, a rolled towel between elbow and ribs','Hold a water bottle or a can. Rotate the forearm up towards the ceiling: 2 seconds up, 3 seconds down','Only the forearm moves. The elbow never leaves the towel','Aim for a tired cuff by rep 15, never a pinch. Right side is the one that matters most'],kitName:'Band external rotation',kitCues:['Stand side-on to the band anchored at elbow height, rolled towel between elbow and ribs','Elbow pinned, rotate the forearm outwards against the band: 2 seconds out, 3 seconds back','Light band. Shoulder blade stays down and back','Right side is the sore side; make those 15 count']},

function mobSubs(st){ const d=st.dose, out=[]; const sides=d.sides?['Left','Right']:[null];

function mobChangeover(){ MR.state='rest'; MR.total=8; MR.end=Date.now()+8000; clearInterval(mobIv); mobIv=setInterval(mobTick,250); render(); mobTick(); }
function mobTick(){ const left=Math.max(0,Math.ceil((MR.end-Date.now())/1000)); const t=$('#mobt'); if(t){ t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); const bar=$('#mobbar'); if(bar) bar.style.width=Math.max(0,Math.min(100,left/MR.total*100))+'%'; }

function mobNext(){ const a=S.mobility.active; clearInterval(mobIv); mobIv=null; a.idx++; MR={i:a.idx,state:'ready',end:0,total:0,sub:0}; save(); window.scrollTo(0,0); render(); }
function mobPrev(){ const a=S.mobility.active; if(a.idx===0) return; clearInterval(mobIv); mobIv=null; a.idx--; const st=a.steps[a.idx]; st.done=false; st.flag=null; MR={i:a.idx,state:'ready',end:0,total:0,sub:0}; save(); render(); }
function mobFinish(){ const a=S.mobility.active; const done=a.steps.filter(s=>s.done).map(s=>({key:s.key,level:s.level,flag:s.flag,name:s.name}));
  const skipped=a.steps.filter(s=>!s.done).map(s=>s.key);
  S.mobility.sessions.push({id:a.id,date:a.date,start:a.start,end:Date.now(),mode:a.mode,kit:a.kit,done,skipped,pain:a.pain,note:(a.note||'').trim()||null});

function mobStreak(){ const days=new Set(S.mobility.sessions.map(s=>dayKey(s.end||s.date))); let k=todayKey(); if(!days.has(k)) k=addDays(k,-1); let n=0; while(days.has(k)){ n++; k=addDays(k,-1); } return n; }
function mobSuggest(){ const out=[]; const ses=S.mobility.sessions;
  for(const key in MOB_LADDERS){ const L=MOB_LADDERS[key], li=mobLevel(key); const hist=[]; for(let i=ses.length-1;i>=0&&hist.length<3;i--){ const d=ses[i].done.find(x=>x.key===key); if(d) hist.push(d); }
    if(!hist.length) continue;
    if(hist[0].flag==='pain'){ out.push({key,kind:'pain',text:`${L.name} felt painful last night.${li>0?' Drop a level or stick with it and shorten the range.':' Shorten the range, or skip it for a few nights and let the stretches do the work.'}`}); continue; }
    if(hist.length===3&&hist.every(h=>h.flag==='easy'&&h.level===li)&&li<L.levels.length-1) out.push({key,kind:'up',text:`${L.name}: easy three nights running. Ready for ${L.levels[li+1].name}.`}); }
  return out; }

      <h2>Re-test</h2><div class="card">${testDue?`<div class="banner" style="margin-bottom:10px">${lastTest?'Two weeks since the last re-test.':'Baseline not recorded yet.'} Do the knee-to-wall test tonight: foot back until the knee only just touches the wall with the heel down, measure big toe to wall.</div>`:''}
        <div class="grid2"><div class="field"><label class="f">Knee-to-wall left (cm)</label><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="${lastTest?lastTest.kwL:'cm'}" data-mob-test="kwL"></div>
        <div class="field"><label class="f">Knee-to-wall right (cm)</label><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="${lastTest?lastTest.kwR:'cm'}" data-mob-test="kwR"></div></div>
        <button class="btn" data-mob="save-test" style="margin-top:10px">Save re-test</button>
        ${m.tests.length?`<table style="margin-top:10px"><tr><th>Date</th><th>Left</th><th>Right</th></tr>${m.tests.slice(-6).reverse().map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${t.kwL??'–'}</td><td>${t.kwR??'–'}</td></tr>`).join('')}</table>`:''}
        <p class="small muted" style="margin-top:8px">Target is about 10 cm. Each extra centimetre is roughly 3.6 degrees of ankle range. Re-test every two weeks, same night of the week.</p></div>
      ${recent.length?`<h2>Recent nights</h2><div class="card" style="padding:0 16px">${recent.map(s=>`<div class="item"><span>${esc(fmtDate(s.date))} · ${s.mode==='short'?'short':'full'}${s.kit?' · kit':''}<br><span class="small muted">${s.done.length} of ${s.done.length+s.skipped.length} steps · ${Math.max(1,Math.round((s.end-s.start)/60000))} min${s.pain?' · pain '+MOB_PAIN.map(p=>s.pain[p]??0).join('/'):''}</span></span></div>`).join('')}</div>`:''}
      <h2>Why this routine</h2><div class="card notes">${MOB_FINDINGS.map(f=>`<p>${esc(f)}</p>`).join('')}</div>
      <h2>At the gym meanwhile</h2><div class="card notes">${MOB_GYM.map(f=>`<p>${esc(f)}</p>`).join('')}</div>
      <p class="small muted" style="margin-top:12px">Not a substitute for a physio. One appointment to get hands on the left SI joint is worth it; take this routine along.</p>`;
  },
  mobsession(){
    const a=S.mobility.active; if(!a) return views.mobility();
    if(a.idx>=a.steps.length){ const p=a.pain||{}; const mins=Math.max(1,Math.round((Date.now()-a.start)/60000)); const done=a.steps.filter(s=>s.done).length;
      return `<div class="topbar"><button class="back" data-mob="prev">‹ Back</button></div><h1>Done</h1><p class="muted">${done} of ${a.steps.length} steps · ${mins} min</p>
        <h2>How are things tonight?</h2>${MOB_PAIN.map(k=>`<div class="card"><div class="row"><h3 style="text-transform:capitalize">${k}</h3></div><div class="seg">${MOB_PAIN_LABEL.map((l,i)=>`<button class="${(p[k]??null)===i?'on':''}" data-mob="pain" data-k="${k}" data-v="${i}">${l}</button>`).join('')}</div></div>`).join('')}
        <div class="card"><h3 style="margin-bottom:8px">Notes</h3><textarea class="note" data-mob-note placeholder="What pinched, what felt easy, anything to change">${esc(a.note||'')}</textarea></div>
        <button class="btn primary" data-mob="finish" style="margin-top:8px">Save tonight</button>
        <button class="btn ghost" data-mob="discard" style="margin-top:8px">Discard</button>`; }
    const st=a.steps[a.idx]; const subs=mobSubs(st); const sub=subs[Math.min(MR.sub,subs.length-1)]; const d=st.dose;
    const left=a.steps.slice(a.idx).reduce((s,x)=>s+mobSecs(x),0);
    const doseTxt=d.type==='time'?`${d.sets}${st.leftExtra&&d.sides?'+1':''} × ${d.secs} s${d.sides?' each side':''}`:`${d.sets}${st.leftExtra&&d.sides?'+1':''} × ${d.reps}${d.alt?' each side, alternating':d.sides?' each side':''}`;
    const subTxt=`${subs.length>1?`Set ${sub.set} of ${subs.length>d.sets?d.sets+'+1':d.sets}`:''}${sub.side?`${subs.length>1?' · ':''}<b>${sub.side}${sub.extra?' (extra set)':''}</b>`:''}`;
    let centre='';
    if(MR.state==='rate') centre=`<p class="muted" style="text-align:center;margin-bottom:10px">How did that feel?</p><div class="grid3"><button class="btn" data-mob="flag" data-v="easy">Easy</button><button class="btn primary" data-mob="flag" data-v="ok">Fine</button><button class="btn danger" data-mob="flag" data-v="pain">Painful</button></div>`;
    else if(MR.state==='rest') centre=`<div class="mobtimer"><div class="small muted">Switch · next: ${esc(subTxt.replace(/<[^>]+>/g,''))}</div><div class="t num" id="mobt">0:08</div><div class="bar"><i id="mobbar"></i></div></div><button class="btn ghost" data-mob="go-now">Start now</button>`;
    else if(d.type==='time') centre=`<div class="mobtimer"><div class="small muted">${subTxt}</div><div class="t num ${MR.state==='running'?'on':''}" id="mobt">${Math.floor(d.secs/60)}:${String(d.secs%60).padStart(2,'0')}</div><div class="bar"><i id="mobbar" style="width:100%"></i></div></div>
      ${MR.state==='running'?`<button class="btn" data-mob="sub-done">Done early</button>`:`<button class="btn primary" data-mob="go">Start ${d.secs} s</button>`}`;
    else centre=`<div class="mobtimer"><div class="small muted">${subTxt}</div><div class="t num">${d.reps}<span class="small muted" style="font-size:18px;font-weight:600"> reps${d.alt?' each side':''}</span></div></div><button class="btn primary" data-mob="sub-done">Done${subs.length>1?' this set':''}</button>`;
    return `<div class="mobprog"><i style="width:${Math.round(a.idx/a.steps.length*100)}%"></i></div>
      <div class="topbar"><div class="small muted">Step ${a.idx+1} of ${a.steps.length} · ${esc(st.block)} · ~${Math.max(1,Math.round(left/60))} min left</div><button class="btn ghost" data-mob="leave" style="width:auto;min-height:36px">Pause</button></div>
      <h1 style="font-size:26px">${esc(st.name)}</h1><p class="muted small">${st.level!=null?`${esc(st.ladder)} level ${st.level+1} of ${st.levelOf} · `:''}${doseTxt}</p>
      ${st.vis&&st.vis.length?`<div class="card vcard" style="margin-top:12px">${mobVis(st.vis)}</div>`:''}
      <div class="card"><p class="small" style="color:var(--accent);font-weight:700;margin-bottom:6px">Why</p><p class="small">${esc(st.why)}</p></div>
      <div class="card"><ol class="cues">${st.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>
      <div class="card" style="padding:16px">${centre}</div>
      <div class="row"><button class="btn ghost" style="width:auto" data-mob="prev" ${a.idx===0?'disabled':''}>‹ Previous</button><button class="btn ghost" style="width:auto" data-mob="skip">Skip ›</button></div>
      ${mobDemo(st.name)}`;
  },
  moblib(){
    const k=route.key; const kit=S.mobility.kit;
    if(k==='_all'){ const one=(x,late)=>{ const useKit=kit&&x.kitCues; const d=late?x.lateDose:x.dose; return `<div class="card"><h3>${esc(late?x.lateName:(useKit&&x.kitName?x.kitName:x.name))}</h3><p class="small muted" style="margin:4px 0 8px">${d.type==='time'?`${d.sets} × ${d.secs} s`:`${d.sets} × ${d.reps}`}${d.sides?' each side':d.alt?' each side, alternating':''}</p>${mobVis(late?x.lateVis:(useKit&&x.kitVis?x.kitVis:x.vis))}<ol class="cues small">${(late?x.lateCues:(useKit?x.kitCues:x.cues)).map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>`; };
      const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      return `<div class="topbar"><button class="back" data-mob="back">‹ Back</button></div><h1>Stretches and extras</h1><p class="muted small">The fixed parts of the routine. Ladders have their own pages.</p>
        ${Object.values(MOB_EX).map(x=>one(x)).join('')}
        <h2>Extras, one per night</h2>${MOB_EXTRAS.map((x,i)=>`<p class="small muted" style="margin:10px 0 4px">${days[i]}</p>${one(x)}${x.lateName?`<p class="small muted" style="margin:-2px 0 4px">From week 3 the ${days[i]} slot becomes:</p>${one(x,true)}`:''}`).join('')}`; }
    const L=MOB_LADDERS[k]; if(!L) return views.mobility(); const li=mobLevel(k);
    return `<div class="topbar"><button class="back" data-mob="back">‹ Back</button></div><h1>${esc(L.name)}</h1><p class="muted small">${esc(L.why)}</p>
      ${L.levels.map((lv,i)=>{ const useKit=kit&&lv.kitCues; const d=useKit&&lv.kitDose?lv.kitDose:lv.dose; return `<div class="card ${i===li?'cur':''}"><div class="row"><h3>${i+1}. ${esc(useKit&&lv.kitName?lv.kitName:lv.name)}</h3>${i===li?'<span class="pill pr">current</span>':`<button class="btn ghost" style="width:auto;min-height:36px" data-mob="set-level" data-key="${k}" data-v="${i}">Use this</button>`}</div>
        <p class="small muted" style="margin:4px 0 8px">${d.type==='time'?`${d.sets} × ${d.secs} s`:`${d.sets} × ${d.reps}`}${d.sides?' each side':d.alt?' each side, alternating':''}${L.leftExtra&&d.sides?', plus one extra set on the left':''}</p>
        ${mobVis(useKit&&lv.kitVis?lv.kitVis:lv.vis)}<ol class="cues small">${(useKit?lv.kitCues:lv.cues).map(c=>`<li>${esc(c)}</li>`).join('')}</ol>${!useKit&&lv.kitName?`<p class="small muted" style="margin-top:6px">With the kit: ${esc(lv.kitName)}</p>`:''}</div>`; }).join('')}
      <p class="small muted">Move up when the current level has felt easy three nights in a row with no pain and clean form. Drop back any time something pinches.</p>`;
  }
});
function drawPain(c){ const {g,w,h}=setupCanvas(c); const pad={l:28,r:8,t:8,b:22}; const pts=S.mobility.sessions.filter(s=>s.pain).slice(-30); if(pts.length<2) return;
  g.font='12px -apple-system,Helvetica,sans-serif'; g.lineWidth=1; g.textAlign='right';
  for(let i=0;i<=3;i++){ const y=h-pad.b-(i/3)*(h-pad.t-pad.b); g.strokeStyle='#434955'; g.beginPath(); g.moveTo(pad.l,y); g.lineTo(w-pad.r,y); g.stroke(); g.fillStyle='#9AA2AF'; g.fillText(i,pad.l-6,y+4); }
  const X=i=>pad.l+(i/(pts.length-1))*(w-pad.l-pad.r), Y=v=>h-pad.b-(v/3)*(h-pad.t-pad.b);
  for(const k of MOB_PAIN){ g.strokeStyle=MOB_COLORS[k]; g.lineWidth=2; g.beginPath(); pts.forEach((p,i)=>{ const v=p.pain[k]??0; i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)); }); g.stroke(); }
  g.fillStyle='#9AA2AF'; g.textAlign='left'; g.fillText(fmtDate(pts[0].date),pad.l,h-6); g.textAlign='right'; g.fillText(fmtDate(pts[pts.length-1].date),w-pad.r,h-6); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-mob]'); if(!b) return; const A=b.dataset.mob, m=S.mobility;
  const acts={
    start:()=>{ if(m.active&&!confirm('Discard the routine in progress?')) return; mobStart(b.dataset.mode); },
    resume:()=>{ primeAudio(); keepAwake(); MR={i:m.active.idx,state:'ready',end:0,total:0,sub:0}; history_=[]; go('mobsession',{},false); },
    go:()=>{ primeAudio(); mobStartTimer(mobCur().dose.secs); },
    'go-now':()=>{ clearInterval(mobIv); const st=mobCur(); if(st.dose.type==='time') mobStartTimer(st.dose.secs); else { MR.state='ready'; render(); } },
    'sub-done':()=>{ clearInterval(mobIv); mobIv=null; mobSubDone(false); },
    flag:()=>mobFlag(b.dataset.v), skip:mobSkip, prev:mobPrev,
    leave:()=>{ clearInterval(mobIv); mobIv=null; save(); history_=[]; go('mobility',{},false); },
    pain:()=>{ m.active.pain=m.active.pain||{}; m.active.pain[b.dataset.k]=+b.dataset.v; save(); render(); },
    finish:()=>{ m.active.pain=m.active.pain||{}; for(const k of MOB_PAIN) if(m.active.pain[k]==null) m.active.pain[k]=0; mobFinish(); },
    discard:()=>{ if(confirm('Discard tonight? Nothing will be saved.')){ m.active=null; clearInterval(mobIv); save(); history_=[]; go('mobility',{},false); } },
    'level-up':()=>{ const k=b.dataset.key; m.levels[k]=mobLevel(k)+1; save(); render(); toast('Moved up'); },
    'level-down':()=>{ const k=b.dataset.key; m.levels[k]=Math.max(0,mobLevel(k)-1); save(); render(); toast('Dropped a level'); },
    'set-level':()=>{ m.levels[b.dataset.key]=+b.dataset.v; save(); render(); },
    lib:()=>go('moblib',{key:b.dataset.key}), back,
    'save-test':()=>{ const L=parseFloat(app.querySelector('[data-mob-test="kwL"]').value), R=parseFloat(app.querySelector('[data-mob-test="kwR"]').value); if(!(L>=0)&&!(R>=0)){ toast('Enter a distance'); return; } m.tests.push({date:Date.now(),kwL:L>=0?L:null,kwR:R>=0?R:null}); save(); render(); toast('Re-test saved'); }
  };
  acts[A]?.();
});
document.addEventListener('change',e=>{ const t=e.target; if(t.hasAttribute('data-mob-kit')){ S.mobility.kit=t.checked; save(); render(); } });
document.addEventListener('input',e=>{ const t=e.target; if(t.hasAttribute('data-mob-note')&&S.mobility.active){ S.mobility.active.note=t.value; save(); } });

/* ---------- boot ---------- */
(async()=>{
  try{ S=await DB.get('data'); }catch(e){}
  if(!S){ S=seed(); } migrate(); save();
  if(S.active) route={view:'workout'}; else if(S.mobility.active){ MR={i:S.mobility.active.idx,state:'ready',end:0,total:0,sub:0}; route={view:'mobsession'}; }
  render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
