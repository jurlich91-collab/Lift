<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lift</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#262A31">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Palette: graphite base, IPF plate colours for programs (red 25kg, blue 20kg, yellow 15kg) */
:root{
  --bg:#262A31; --surface:#333841; --line:#434955; --text:#F3F4F6; --muted:#9AA2AF;
  --red:#D9403F; --blue:#2E6FDB; --yellow:#F1C232; --green:#3FB56B;
  --accent:var(--yellow); --accent-ink:#1E1A08;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --tabs:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{padding-top:var(--sat)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;min-height:44px}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:48px}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number]{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;text-align:center;padding:6px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:20px;font-weight:700;margin:24px 0 10px}
h3{font-size:17px;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
#app{padding:16px 16px calc(var(--tabs) + var(--sab) + 24px);max-width:560px;margin:0 auto}
#app.with-timer{padding-bottom:calc(var(--tabs) + var(--sab) + 130px)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.back{color:var(--muted);font-size:16px;padding:0 6px 0 0}
.card{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:0 18px;
  min-height:52px;font-weight:700;font-size:17px;background:var(--surface);border:1px solid var(--line);width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;color:var(--muted);min-height:44px}
.btn:disabled{opacity:.45}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700}
.pill.pr{background:var(--accent);color:var(--accent-ink)}
.swatch{width:10px;height:38px;border-radius:5px;flex:none}

/* program cards on home */
.program{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:14px;padding:14px 16px;width:100%;text-align:left;margin-bottom:10px}
.program .name{font-size:20px;font-weight:800}
.program.next{outline:2px solid var(--accent);outline-offset:-2px}
.program .go{margin-left:auto;color:var(--muted)}

/* workout */
.ex{background:var(--surface);border-radius:14px;padding:12px 12px 8px;margin-bottom:12px}
.ex header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 4px 8px}
.ex .target{color:var(--muted);font-size:14px;white-space:nowrap}
.sets{display:grid;grid-template-columns:36px 1fr 1fr 60px;gap:8px;align-items:center}
.sets .hd{color:var(--muted);font-size:13px;text-align:center;padding-bottom:2px}
.sets .hd:first-child{text-align:left;padding-left:4px}
.set-n{color:var(--muted);font-weight:700;padding-left:4px}
.set-n .last{display:block;font-size:11px;font-weight:500;white-space:nowrap}
.set-n .last .h{color:var(--text)}
.done .set-n .last{visibility:hidden}
.check{height:48px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.check.done{background:var(--green);border-color:var(--green);color:#082F14}
.done input{opacity:.55}
.ex footer{display:flex;justify-content:space-between;padding-top:8px}
.ss-note{color:var(--muted);font-size:13px;padding:0 4px 8px}
.prflash{color:var(--accent);font-weight:800;font-size:13px;text-align:center}

/* timer bar */
#timer{position:fixed;left:0;right:0;bottom:calc(var(--tabs) + var(--sab));background:var(--surface);
  border-top:1px solid var(--line);padding:10px 16px 12px;display:none;z-index:20}
#timer.on{display:block}
#timer .t{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
#timer .t.over{color:var(--accent)}
#timer .ctl{display:flex;gap:8px}
#timer .ctl button{background:var(--bg);border:1px solid var(--line);border-radius:10px;min-width:56px;padding:0 12px;font-weight:700}
#timer .bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
#timer .bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabs) + var(--sab));padding-bottom:var(--sab);
  background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:30}
#tabs button{flex:1;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#tabs button.on{color:var(--text)}
#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs.hidden{display:none}

/* lists */
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .chev{color:var(--muted)}
canvas{width:100%;height:150px;display:block}
.chart-title{color:var(--muted);font-size:14px;margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);font-weight:500}
th{color:var(--muted);font-weight:600;font-size:14px}
td:first-child,th:first-child{text-align:left}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px;flex:1}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label.f{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.field input{font-size:17px;font-weight:500;text-align:left;padding:10px 12px}
.field input[type=number]{text-align:center;font-weight:700}
.editor-ex{background:var(--surface);border-radius:14px;padding:12px;margin-bottom:10px}
.editor-ex .hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.editor-ex .hdr select{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:48px;-webkit-appearance:none}
.editor-ex .icon{width:44px;color:var(--muted);font-size:20px;font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;min-height:44px}
.toggle input{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 12px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer">
  <div class="row">
    <div>
      <div class="small muted" id="timer-label">Rest</div>
      <div class="t num" id="timer-t">1:30</div>
    </div>
    <div class="ctl">
      <button data-action="timer-adj" data-v="-15">−15</button>
      <button data-action="timer-adj" data-v="15">+15</button>
      <button data-action="timer-stop">Skip</button>
    </div>
  </div>
  <div class="bar"><i id="timer-bar"></i></div>
</div>
<nav id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Lift</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  <button data-tab="exercises"><svg viewBox="0 0 24 24"><path d="M4 19L9 9l4 6 3-4 4 8"/></svg>Progress</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- storage (IndexedDB, one document) ---------- */
const DB = {
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('lift',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async set(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
};
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>DB.set('data',S).catch(e=>toast('Save failed: '+e.message)),150); }

/* ---------- seed data ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
function seed(){
  const ex=(name,group)=>({id:uid(),name,group});
  const E={
    bench:ex('Bench press','Chest'), ohp:ex('Overhead press','Shoulders'), incl:ex('Incline dumbbell press','Chest'),
    lat:ex('Lateral raise','Shoulders'), push:ex('Tricep pushdown','Arms'),
    dl:ex('Deadlift','Back'), pd:ex('Lat pulldown','Back'), rowc:ex('Seated cable row','Back'), face:ex('Face pull','Shoulders'), curl:ex('Bicep curl','Arms'),
    sq:ex('Squat','Legs'), rdl:ex('Romanian deadlift','Legs'), lp:ex('Leg press','Legs'), lc:ex('Leg curl','Legs'), calf:ex('Calf raise','Legs')
  };
  const pe=(e,sets,reps,rest,ss=false)=>({exId:e.id,sets,reps,rest,ss});
  return {
    version:1,
    exercises:Object.values(E),
    programs:[
      {id:uid(),name:'Push',color:'red',items:[pe(E.bench,3,8,120),pe(E.ohp,3,8,120),pe(E.incl,3,10,90),pe(E.lat,3,12,60,true),pe(E.push,3,12,60)]},
      {id:uid(),name:'Pull',color:'blue',items:[pe(E.dl,3,5,180),pe(E.pd,3,10,90),pe(E.rowc,3,10,90),pe(E.face,3,15,60,true),pe(E.curl,3,12,60)]},
      {id:uid(),name:'Legs',color:'yellow',items:[pe(E.sq,3,6,150),pe(E.rdl,3,8,120),pe(E.lp,3,10,90),pe(E.lc,3,12,60,true),pe(E.calf,3,15,60)]}
    ],
    sessions:[], active:null, rotation:0, cardioName:'Stairmaster'
  };
}

/* ---------- state & routing ---------- */
let S=null;
let route={view:'home'};
let history_=[];
const $=s=>document.querySelector(s);
const app=$('#app');
const COLORS={red:'var(--red)',blue:'var(--blue)',yellow:'var(--yellow)',green:'var(--green)'};
const exById=id=>S.exercises.find(e=>e.id===id);
const progById=id=>S.programs.find(p=>p.id===id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const fmtKg=n=>(Math.round(n*10)/10).toString();
const e1rm=(w,r)=>r===1?w:w*(1+r/30);

function go(view,params={},push=true){ if(push) history_.push(route); route={view,...params}; window.scrollTo(0,0); render(); }
function back(){ route=history_.pop()||{view:'home'}; render(); }

/* ---------- stats ---------- */
function setsFor(exId,excludeActive=true){
  const out=[]; for(const s of S.sessions) for(const st of s.sets) if(st.exId===exId&&st.weight>0&&st.reps>0) out.push({...st,date:s.date,sessionId:s.id});
  return out;
}
function lastSessionSets(exId){ for(let i=S.sessions.length-1;i>=0;i--){ const st=S.sessions[i].sets.filter(x=>x.exId===exId); if(st.length) return st; } return null; }
function bests(exId){
  const sets=setsFor(exId); let w=0,e=0,vol=0; const reps={};
  for(const s of sets){ if(s.weight>w) w=s.weight; const v=e1rm(s.weight,s.reps); if(v>e) e=v; if(!reps[s.reps]||s.weight>reps[s.reps]) reps[s.reps]=s.weight; }
  return {weight:w,e1rm:e,reps,count:sets.length};
}
function checkPR(exId,weight,reps){
  const b=bests(exId); const flags=[];
  if(b.count===0) return flags;
  if(weight>b.weight) flags.push('Heaviest');
  if(e1rm(weight,reps)>b.e1rm+0.01) flags.push('Est. 1RM');
  if(!flags.length && (!b.reps[reps]||weight>b.reps[reps])) flags.push(reps+'-rep');
  return flags;
}
function sessionVolume(s){ return s.sets.reduce((a,x)=>a+x.weight*x.reps,0); }
function perSession(exId){ // one point per session: top set weight, e1rm, volume
  const out=[]; for(const s of S.sessions){ const st=s.sets.filter(x=>x.exId===exId&&x.weight>0&&x.reps>0); if(!st.length) continue;
    out.push({date:s.date,top:Math.max(...st.map(x=>x.weight)),e1rm:Math.max(...st.map(x=>e1rm(x.weight,x.reps))),vol:st.reduce((a,x)=>a+x.weight*x.reps,0)}); }
  return out;
}

/* ---------- views ---------- */
function render(){
  const v=views[route.view]||views.home; app.innerHTML=v(); app.classList.toggle('with-timer',timer.on);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',tabFor(route.view)===b.dataset.tab));
  $('#tabs').classList.toggle('hidden',route.view==='workout');
  app.querySelectorAll('canvas[data-chart]').forEach(drawChart);
}
function tabFor(v){ return {home:'home',workout:'home',history:'history',session:'history',exercises:'exercises',exercise:'exercises',settings:'settings',editor:'settings',exlist:'settings'}[v]||'home'; }

const views={
  home(){
    const nextIdx=S.rotation%S.programs.length;
    const recent=S.sessions.slice(-3).reverse();
    const resume=S.active?`<button class="btn primary" data-action="resume" style="margin-bottom:16px">Resume ${esc(progById(S.active.programId)?.name||'workout')}</button>`:'';
    return `<h1>Lift</h1><p class="muted">${S.sessions.length?`${S.sessions.length} workout${S.sessions.length>1?'s':''} logged`:'No workouts yet. Pick a program to start.'}</p>
    <h2>Programs</h2>${resume}
    ${S.programs.map((p,i)=>`<button class="program ${i===nextIdx&&!S.active?'next':''}" data-action="start" data-id="${p.id}">
      <span class="swatch" style="background:${COLORS[p.color]}"></span>
      <span><span class="name">${esc(p.name)}</span><br><span class="small muted">${p.items.length} exercises${i===nextIdx?' · up next':''}</span></span>
      <span class="go">Start</span></button>`).join('')}
    <button class="btn ghost" data-action="quick">Start an empty workout</button>
    ${recent.length?`<h2>Recent</h2><div class="card" style="padding:0 16px">${recent.map(sessionRow).join('')}</div>`:''}`;
  },

  workout(){
    const a=S.active; if(!a) return views.home();
    const prog=progById(a.programId);
    let html=`<div class="topbar"><div><h1>${esc(a.name)}</h1><p class="muted small">${fmtDate(a.date)} · started ${new Date(a.start).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</p></div>
      <button class="btn ghost" data-action="cancel-workout" style="width:auto">Discard</button></div>`;
    a.items.forEach((it,ii)=>{
      const ex=exById(it.exId); const last=lastSessionSets(it.exId); const nextIsPair=it.ss&&a.items[ii+1];
      html+=`<div class="ex" data-ii="${ii}"><header><h3>${esc(ex?.name||'Exercise')}</h3><span class="target">${it.sets.length} × ${it.reps} · rest ${it.rest}s</span></header>
        ${nextIsPair?`<div class="ss-note">Superset with ${esc(exById(a.items[ii+1].exId)?.name||'')} — rest after the pair</div>`:''}
        <div class="sets"><div class="hd">Set</div><div class="hd">kg</div><div class="hd">Reps</div><div class="hd"></div>`;
      it.sets.forEach((st,si)=>{
        const l=last&&last[si]; const lastTxt=l?`<span class="last">last <span class="h">${fmtKg(l.weight)}×${l.reps}</span></span>`:'<span class="last">&nbsp;</span>';
        html+=`<div class="set-n ${st.done?'done':''}">${si+1}${lastTxt}</div>
          <input type="number" inputmode="decimal" step="0.5" min="0" value="${st.weight??''}" placeholder="${l?fmtKg(l.weight):'–'}" data-f="weight" data-ii="${ii}" data-si="${si}" ${st.done?'disabled':''}>
          <input type="number" inputmode="numeric" step="1" min="0" value="${st.reps??''}" placeholder="${l?l.reps:it.reps}" data-f="reps" data-ii="${ii}" data-si="${si}" ${st.done?'disabled':''}>
          <button class="check ${st.done?'done':''}" data-action="toggle-set" data-ii="${ii}" data-si="${si}" aria-label="${st.done?'Undo set':'Log set'}">${st.done?'✓':''}</button>`;
      });
      html+=`</div>${it.pr?`<div class="prflash">${esc(it.pr)}</div>`:''}
        <footer><button class="btn ghost" style="width:auto" data-action="rm-set" data-ii="${ii}" ${it.sets.length<=1?'disabled':''}>− set</button>
        <button class="btn ghost" style="width:auto" data-action="add-set" data-ii="${ii}">+ set</button></footer></div>`;
    });
    html+=`<button class="btn" data-action="add-ex-active" style="margin-bottom:12px">Add exercise</button>
      <div class="card"><h3 style="margin-bottom:10px">${esc(S.cardioName)}</h3><div class="grid3">
        <div class="field"><label class="f">Minutes</label><input type="number" inputmode="numeric" value="${a.cardio.minutes??''}" data-cardio="minutes"></div>
        <div class="field"><label class="f">Level</label><input type="number" inputmode="numeric" value="${a.cardio.level??''}" data-cardio="level"></div>
        <div class="field"><label class="f">kcal</label><input type="number" inputmode="numeric" value="${a.cardio.kcal??''}" data-cardio="kcal"></div></div></div>
      <button class="btn primary" data-action="finish" style="margin-top:8px">Finish workout</button>`;
    return html;
  },

  history(){
    if(!S.sessions.length) return `<h1>History</h1><div class="empty">Finished workouts show up here.</div>`;
    const weeks=weeklyVolume();
    return `<h1>History</h1>
      <div class="chart-title">Weekly volume by muscle group (kg × reps, last 12 weeks)</div><div class="card"><canvas data-chart="weekly"></canvas>
      <div class="small muted" style="margin-top:8px">${Object.entries(GROUP_COLORS).map(([g,c])=>`<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin:0 4px 0 8px"></span>${g}`).join('')}</div></div>
      <div class="card" style="padding:0 16px">${S.sessions.slice().reverse().map(sessionRow).join('')}</div>`;
  },

  session(){
    const s=S.sessions.find(x=>x.id===route.id); if(!s) return views.history();
    const byEx={}; for(const st of s.sets){ (byEx[st.exId]=byEx[st.exId]||[]).push(st); }
    const dur=s.end?Math.round((s.end-s.start)/60000):null;
    return `<div class="topbar"><button class="back" data-action="back">‹ Back</button></div>
      <h1>${esc(s.name)}</h1><p class="muted">${fmtDate(s.date)}${dur?` · ${dur} min`:''} · ${fmtKg(sessionVolume(s))} kg volume</p>
      ${Object.entries(byEx).map(([id,sets])=>`<div class="card"><h3>${esc(exById(id)?.name||'Exercise')}</h3>
        <p class="num" style="margin-top:6px">${sets.map(x=>`${fmtKg(x.weight)}×${x.reps}`).join(' &nbsp; ')}</p></div>`).join('')}
      ${s.cardio&&(s.cardio.minutes||s.cardio.kcal)?`<div class="card"><h3>${esc(S.cardioName)}</h3><p class="muted" style="margin-top:6px">${[s.cardio.minutes&&s.cardio.minutes+' min',s.cardio.level&&'level '+s.cardio.level,s.cardio.kcal&&s.cardio.kcal+' kcal'].filter(Boolean).join(' · ')}</p></div>`:''}
      <button class="btn danger" data-action="del-session" data-id="${s.id}" style="margin-top:12px">Delete workout</button>`;
  },

  exercises(){
    const list=S.exercises.slice().sort((a,b)=>a.group.localeCompare(b.group)||a.name.localeCompare(b.name));
    return `<h1>Progress</h1><p class="muted">Tap an exercise for records and charts.</p>
      <div class="card" style="padding:0 16px;margin-top:16px">${list.map(e=>{const b=bests(e.id);return `<button class="item" data-action="open-ex" data-id="${e.id}">
        <span><span>${esc(e.name)}</span><br><span class="small muted">${esc(e.group)}</span></span>
        <span class="num">${b.count?`<b>${fmtKg(b.weight)}</b> <span class="muted small">kg best</span>`:'<span class="muted small">no data</span>'}<span class="chev"> ›</span></span></button>`;}).join('')}</div>`;
  },

  exercise(){
    const e=exById(route.id); if(!e) return views.exercises();
    const b=bests(e.id); const pts=perSession(e.id);
    const repRows=Object.keys(b.reps).map(Number).sort((a,c)=>a-c).map(r=>`<tr><td>${r} rep${r>1?'s':''}</td><td>${fmtKg(b.reps[r])} kg</td><td>${fmtKg(e1rm(b.reps[r],r))} kg</td></tr>`).join('');
    return `<div class="topbar"><button class="back" data-action="back">‹ Back</button></div>
      <h1>${esc(e.name)}</h1><p class="muted">${esc(e.group)} · ${pts.length} session${pts.length===1?'':'s'}</p>
      ${b.count?`<div class="grid2" style="margin-top:16px"><div class="stat"><div class="v num">${fmtKg(b.weight)} kg</div><div class="l">Heaviest set</div></div>
        <div class="stat"><div class="v num">${fmtKg(b.e1rm)} kg</div><div class="l">Best estimated 1RM</div></div></div>
      <div class="chart-title">Estimated 1RM</div><div class="card"><canvas data-chart="e1rm" data-id="${e.id}"></canvas></div>
      <div class="chart-title">Top set weight</div><div class="card"><canvas data-chart="top" data-id="${e.id}"></canvas></div>
      <div class="chart-title">Volume per session</div><div class="card"><canvas data-chart="vol" data-id="${e.id}"></canvas></div>
      <h2>Rep records</h2><div class="card"><table><tr><th>Reps</th><th>Best weight</th><th>Est. 1RM</th></tr>${repRows}</table></div>
      <h2>Log</h2><div class="card">${pts.slice().reverse().map(p=>{const s=S.sessions.find(x=>x.date===p.date);const sets=s.sets.filter(x=>x.exId===e.id);
        return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="muted small">${fmtDate(p.date)}</span><span class="num small">${sets.map(x=>`${fmtKg(x.weight)}×${x.reps}`).join('  ')}</span></div>`;}).join('')}</div>`
      :`<div class="empty">Log this exercise in a workout and your records will appear here.</div>`}
      <button class="btn ghost" data-action="rename-ex" data-id="${e.id}" style="margin-top:12px">Rename or change muscle group</button>`;
  },

  settings(){
    return `<h1>Settings</h1>
      <h2>Programs</h2><div class="card" style="padding:0 16px">${S.programs.map(p=>`<button class="item" data-action="edit-prog" data-id="${p.id}">
        <span class="row" style="gap:12px"><span class="swatch" style="background:${COLORS[p.color]};height:24px"></span>${esc(p.name)}</span><span class="chev">›</span></button>`).join('')}</div>
      <button class="btn" data-action="new-prog">New program</button>
      <h2>Exercises</h2><button class="btn" data-action="exlist">Manage exercise list</button>
      <h2>Cardio</h2><div class="card field"><label class="f">Name shown at the end of each workout</label><input value="${esc(S.cardioName)}" data-setting="cardioName"></div>
      <h2>Rotation</h2><div class="card row"><span>Up next: <b>${esc(S.programs[S.rotation%S.programs.length]?.name||'')}</b></span><button class="btn ghost" style="width:auto" data-action="rotate">Skip</button></div>
      <h2>Data</h2><div class="stack"><button class="btn" data-action="export">Export backup (JSON)</button>
      <button class="btn" data-action="import">Import backup</button><input type="file" id="importfile" accept="application/json" hidden>
      <button class="btn danger" data-action="reset">Reset everything</button></div>
      <p class="small muted" style="margin-top:20px">Data lives on this phone only. Export a backup now and then.</p>`;
  },

  editor(){
    const p=progById(route.id); if(!p) return views.settings();
    const opts=sel=>S.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.name)}</option>`).join('');
    return `<div class="topbar"><button class="back" data-action="back">‹ Done</button></div>
      <div class="card"><div class="field"><label class="f">Program name</label><input value="${esc(p.name)}" data-prog="name"></div>
      <label class="f" style="margin-top:12px">Colour</label><div class="row" style="justify-content:flex-start">${Object.keys(COLORS).map(c=>`<button data-action="prog-color" data-c="${c}" style="width:44px;height:44px;border-radius:12px;background:${COLORS[c]};${p.color===c?'outline:3px solid var(--text);outline-offset:2px':''}" aria-label="${c}"></button>`).join('')}</div></div>
      <h2>Exercises</h2>
      ${p.items.map((it,i)=>`<div class="editor-ex"><div class="hdr">
          <button class="icon" data-action="ed-up" data-i="${i}" ${i===0?'disabled':''} aria-label="Move up">↑</button>
          <select data-ed="exId" data-i="${i}">${opts(it.exId)}</select>
          <button class="icon" data-action="ed-rm" data-i="${i}" aria-label="Remove">×</button></div>
        <div class="grid3">
          <div class="field"><label class="f">Sets</label><input type="number" inputmode="numeric" value="${it.sets}" data-ed="sets" data-i="${i}"></div>
          <div class="field"><label class="f">Reps</label><input type="number" inputmode="numeric" value="${it.reps}" data-ed="reps" data-i="${i}"></div>
          <div class="field"><label class="f">Rest (s)</label><input type="number" inputmode="numeric" value="${it.rest}" data-ed="rest" data-i="${i}"></div></div>
        ${i<p.items.length-1?`<label class="toggle"><input type="checkbox" data-ed="ss" data-i="${i}" ${it.ss?'checked':''}> Superset with the next exercise</label>`:''}</div>`).join('')}
      <button class="btn" data-action="ed-add">Add exercise</button>
      <button class="btn danger" data-action="del-prog" style="margin-top:20px">Delete program</button>`;
  },

  exlist(){
    return `<div class="topbar"><button class="back" data-action="back">‹ Back</button></div><h1>Exercises</h1>
      <button class="btn" data-action="new-ex" style="margin:12px 0">Add exercise</button>
      <div class="card" style="padding:0 16px">${S.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<div class="item"><span>${esc(e.name)}<br><span class="small muted">${esc(e.group)}</span></span>
        <span><button class="btn ghost" style="width:auto" data-action="rename-ex" data-id="${e.id}">Edit</button><button class="btn ghost" style="width:auto;color:var(--red)" data-action="del-ex" data-id="${e.id}">Delete</button></span></div>`).join('')}</div>`;
  }
};

function sessionRow(s){ return `<button class="item" data-action="open-session" data-id="${s.id}">
  <span><span>${esc(s.name)}</span><br><span class="small muted">${fmtDate(s.date)} · ${s.sets.length} set${s.sets.length===1?"":"s"}</span></span>
  <span class="num small muted">${fmtKg(sessionVolume(s))} kg<span class="chev"> ›</span></span></button>`; }

/* ---------- charts (hand drawn, offline) ---------- */
const GROUP_COLORS={Chest:'#D9403F',Back:'#2E6FDB',Legs:'#F1C232',Shoulders:'#3FB56B',Arms:'#B067E3',Other:'#9AA2AF'};
function weeklyVolume(){
  const now=Date.now(), wk=7*864e5, weeks=[]; const start=now-11*wk;
  for(let i=0;i<12;i++) weeks.push({}); 
  for(const s of S.sessions){ if(s.date<start-wk) continue; const i=Math.min(11,Math.max(0,Math.floor((s.date-start)/wk)));
    for(const st of s.sets){ const g=exById(st.exId)?.group||'Other'; const k=GROUP_COLORS[g]?g:'Other'; weeks[i][k]=(weeks[i][k]||0)+st.weight*st.reps; } }
  return weeks;
}
function setupCanvas(c){ const dpr=window.devicePixelRatio||1; const w=c.clientWidth||300,h=c.clientHeight||150; c.width=w*dpr; c.height=h*dpr; const g=c.getContext('2d'); g.scale(dpr,dpr); return {g,w,h}; }
function drawChart(c){
  const {g,w,h}=setupCanvas(c); const pad={l:40,r:8,t:8,b:22};
  g.font='12px -apple-system,Helvetica,sans-serif'; g.fillStyle='#9AA2AF'; g.strokeStyle='#434955';
  if(c.dataset.chart==='weekly'){
    const weeks=weeklyVolume(); const tot=weeks.map(wk=>Object.values(wk).reduce((a,b)=>a+b,0)); const max=Math.max(1,...tot);
    const bw=(w-pad.l-pad.r)/12; grid(g,w,h,pad,max,3);
    weeks.forEach((wk,i)=>{ let y=h-pad.b; const x=pad.l+i*bw+3;
      for(const [gname,v] of Object.entries(wk)){ const bh=(v/max)*(h-pad.t-pad.b); g.fillStyle=GROUP_COLORS[gname]; g.fillRect(x,y-bh,bw-6,bh); y-=bh; } });
    g.fillStyle='#9AA2AF'; g.textAlign='left'; g.fillText('11 wks ago',pad.l,h-6); g.textAlign='right'; g.fillText('this week',w-pad.r,h-6); return;
  }
  const pts=perSession(c.dataset.id); const key=c.dataset.chart; const ys=pts.map(p=>p[key]); if(!ys.length) return;
  const max=Math.max(...ys), min=key==='vol'?0:Math.min(...ys); const span=Math.max(1,max-min); const lo=key==='vol'?0:min-span*0.15, hi=max+span*0.15;
  grid(g,w,h,pad,hi,3,lo);
  const X=i=>pad.l+(pts.length===1?0.5:i/(pts.length-1))*(w-pad.l-pad.r), Y=v=>h-pad.b-((v-lo)/(hi-lo))*(h-pad.t-pad.b);
  g.strokeStyle='#F1C232'; g.lineWidth=2.5; g.lineJoin='round'; g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(X(i),Y(p[key])):g.moveTo(X(i),Y(p[key]))); g.stroke();
  g.fillStyle='#F1C232'; pts.forEach((p,i)=>{ g.beginPath(); g.arc(X(i),Y(p[key]),3.5,0,7); g.fill(); });
  g.fillStyle='#9AA2AF'; g.textAlign='left'; g.fillText(fmtDate(pts[0].date),pad.l,h-6);
  if(pts.length>1){ g.textAlign='right'; g.fillText(fmtDate(pts[pts.length-1].date),w-pad.r,h-6); }
}
function grid(g,w,h,pad,hi,n,lo=0){ g.textAlign='right'; g.lineWidth=1; for(let i=0;i<=n;i++){ const v=lo+(hi-lo)*i/n; const y=h-pad.b-(i/n)*(h-pad.t-pad.b);
  g.strokeStyle='#434955'; g.beginPath(); g.moveTo(pad.l,y); g.lineTo(w-pad.r,y); g.stroke(); g.fillStyle='#9AA2AF'; g.fillText(v>=1000?(v/1000).toFixed(1).replace('.0','')+'k':Math.round(v),pad.l-6,y+4); } }

/* ---------- rest timer ---------- */
const timer={on:false,end:0,total:0,iv:null,label:''};
let audioCtx=null;
function beep(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime;
  [0,0.18,0.36].forEach((d,i)=>{ const o=audioCtx.createOscillator(), gn=audioCtx.createGain(); o.type='sine'; o.frequency.value=i===2?1320:880; gn.gain.setValueAtTime(0.0001,t+d); gn.gain.exponentialRampToValueAtTime(0.5,t+d+0.01); gn.gain.exponentialRampToValueAtTime(0.0001,t+d+0.15); o.connect(gn).connect(audioCtx.destination); o.start(t+d); o.stop(t+d+0.16); }); }catch(e){} }
function primeAudio(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function startRest(sec,label){ timer.on=true; timer.total=sec; timer.end=Date.now()+sec*1000; timer.label=label; timer.fired=false; $('#timer').classList.add('on'); app.classList.add('with-timer'); clearInterval(timer.iv); timer.iv=setInterval(tick,250); tick(); }
function stopRest(){ timer.on=false; clearInterval(timer.iv); $('#timer').classList.remove('on'); app.classList.remove('with-timer'); }
function tick(){ const left=Math.ceil((timer.end-Date.now())/1000); const t=$('#timer-t'); const a=Math.abs(left);
  t.textContent=(left<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0'); t.classList.toggle('over',left<=0);
  $('#timer-label').textContent=left>0?'Rest · '+timer.label:'Go · '+timer.label;
  $('#timer-bar').style.width=Math.max(0,Math.min(100,left/timer.total*100))+'%';
  if(left<=0&&!timer.fired){ timer.fired=true; beep(); if(navigator.vibrate) navigator.vibrate([200,100,200]); }
  if(left<=-60) stopRest(); }

/* ---------- wake lock ---------- */
let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S?.active) keepAwake(); if(timer.on) tick(); });

/* ---------- actions ---------- */
function startWorkout(prog){
  const items=(prog?prog.items:[]).map(it=>({exId:it.exId,reps:it.reps,rest:it.rest,ss:it.ss,sets:Array.from({length:it.sets},()=>({weight:null,reps:null,done:false}))}));
  S.active={id:uid(),programId:prog?.id||null,name:prog?.name||'Workout',date:Date.now(),start:Date.now(),items,cardio:{}};
  save(); primeAudio(); keepAwake(); go('workout');
}
function finishWorkout(){
  const a=S.active; const sets=[]; a.items.forEach(it=>it.sets.forEach(st=>{ if(st.done&&st.weight>0&&st.reps>0) sets.push({exId:it.exId,weight:st.weight,reps:st.reps}); }));
  if(!sets.length&&!a.cardio.minutes){ if(!confirm('Nothing logged. Finish anyway?')) return; }
  S.sessions.push({id:a.id,programId:a.programId,name:a.name,date:a.date,start:a.start,end:Date.now(),sets,cardio:a.cardio});
  if(a.programId){ const idx=S.programs.findIndex(p=>p.id===a.programId); if(idx>=0) S.rotation=idx+1; }
  S.active=null; stopRest(); if(wake) wake.release?.(); save(); history_=[]; go('session',{id:a.id},false); toast('Workout saved');
}
function toggleSet(ii,si){
  const a=S.active, it=a.items[ii], st=it.sets[si];
  if(st.done){ st.done=false; it.pr=null; save(); render(); return; }
  const wIn=app.querySelector(`input[data-f="weight"][data-ii="${ii}"][data-si="${si}"]`);
  const rIn=app.querySelector(`input[data-f="reps"][data-ii="${ii}"][data-si="${si}"]`);
  const w=parseFloat(wIn.value||wIn.placeholder), r=parseInt(rIn.value||rIn.placeholder,10);
  if(!(w>=0)||!(r>0)){ toast('Enter weight and reps'); return; }
  st.weight=w; st.reps=r; st.done=true;
  const pr=checkPR(it.exId,w,r); if(pr.length){ it.pr=`PR: ${pr.join(', ')} — ${fmtKg(w)} × ${r}`; }
  // rest: skip if this exercise supersets into the next one
  const paired=it.ss&&a.items[ii+1]; if(!paired) startRest(it.rest||90,exById(it.exId)?.name||'');
  // prefill next set
  const nx=it.sets[si+1]; if(nx&&!nx.done&&nx.weight==null){ nx.weight=w; nx.reps=r; }
  save(); render();
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function pickExercise(cb){ const names=S.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name)); const s=prompt('Exercise name (type a new one to create it):\n'+names.map(e=>e.name).join(', ')); if(!s) return;
  let e=S.exercises.find(x=>x.name.toLowerCase()===s.trim().toLowerCase()); if(!e){ const gsel=prompt('Muscle group (Chest, Back, Legs, Shoulders, Arms, Other)','Other')||'Other'; e={id:uid(),name:s.trim(),group:gsel}; S.exercises.push(e); } cb(e); }
function download(name,text){ const b=new Blob([text],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }

document.addEventListener('click',e=>{
  const tab=e.target.closest('#tabs button'); if(tab){ if(S.active&&tab.dataset.tab==='home'){ history_=[]; go('workout',{},false); } else { history_=[]; go(tab.dataset.tab,{},false); } return; }
  const b=e.target.closest('[data-action]'); if(!b) return; const A=b.dataset.action, id=b.dataset.id;
  const acts={
    back, start:()=>{ if(S.active&&!confirm('Discard the workout in progress?')) return; startWorkout(progById(id)); },
    quick:()=>startWorkout(null), resume:()=>{ primeAudio(); keepAwake(); go('workout'); },
    'toggle-set':()=>toggleSet(+b.dataset.ii,+b.dataset.si),
    'add-set':()=>{ const it=S.active.items[+b.dataset.ii]; const l=it.sets[it.sets.length-1]; it.sets.push({weight:l?.weight??null,reps:l?.reps??null,done:false}); save(); render(); },
    'rm-set':()=>{ const it=S.active.items[+b.dataset.ii]; if(it.sets.length>1) it.sets.pop(); save(); render(); },
    'add-ex-active':()=>pickExercise(ex=>{ S.active.items.push({exId:ex.id,reps:10,rest:90,ss:false,sets:[{weight:null,reps:null,done:false},{weight:null,reps:null,done:false},{weight:null,reps:null,done:false}]}); save(); render(); }),
    finish:finishWorkout,
    'cancel-workout':()=>{ if(confirm('Discard this workout? Nothing will be saved.')){ S.active=null; stopRest(); save(); history_=[]; go('home',{},false); } },
    'timer-adj':()=>{ timer.end+=(+b.dataset.v)*1000; timer.total=Math.max(1,timer.total+(+b.dataset.v)); tick(); },
    'timer-stop':stopRest,
    'open-session':()=>go('session',{id}), 'open-ex':()=>go('exercise',{id}),
    'del-session':()=>{ if(confirm('Delete this workout?')){ S.sessions=S.sessions.filter(s=>s.id!==id); save(); history_=[]; go('history',{},false); } },
    'edit-prog':()=>go('editor',{id}),
    'new-prog':()=>{ const p={id:uid(),name:'New program',color:'green',items:[]}; S.programs.push(p); save(); go('editor',{id:p.id}); },
    'del-prog':()=>{ const p=progById(route.id); if(confirm(`Delete ${p.name}?`)){ S.programs=S.programs.filter(x=>x.id!==p.id); S.rotation=0; save(); back(); } },
    'prog-color':()=>{ progById(route.id).color=b.dataset.c; save(); render(); },
    'ed-up':()=>{ const p=progById(route.id), i=+b.dataset.i; [p.items[i-1],p.items[i]]=[p.items[i],p.items[i-1]]; save(); render(); },
    'ed-rm':()=>{ progById(route.id).items.splice(+b.dataset.i,1); save(); render(); },
    'ed-add':()=>pickExercise(ex=>{ progById(route.id).items.push({exId:ex.id,sets:3,reps:10,rest:90,ss:false}); save(); render(); }),
    exlist:()=>go('exlist'),
    'new-ex':()=>pickExercise(()=>{ save(); render(); }),
    'rename-ex':()=>{ const ex=exById(id); const n=prompt('Exercise name',ex.name); if(n===null) return; const g=prompt('Muscle group (Chest, Back, Legs, Shoulders, Arms, Other)',ex.group); ex.name=n.trim()||ex.name; ex.group=(g||ex.group).trim(); save(); render(); },
    'del-ex':()=>{ const used=S.sessions.some(s=>s.sets.some(x=>x.exId===id))||S.programs.some(p=>p.items.some(x=>x.exId===id)); if(used){ toast('In use by a program or logged workout'); return; } if(confirm('Delete exercise?')){ S.exercises=S.exercises.filter(x=>x.id!==id); save(); render(); } },
    rotate:()=>{ S.rotation++; save(); render(); },
    export:()=>download(`lift-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S,null,1)),
    import:()=>$('#importfile').click(),
    reset:()=>{ if(confirm('Delete all programs, exercises and history on this phone?')&&confirm('Really? Export a backup first if you want one.')){ S=seed(); save(); history_=[]; go('home',{},false); } }
  };
  acts[A]?.();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('#importfile')){ const f=t.files[0]; if(!f) return; f.text().then(txt=>{ const d=JSON.parse(txt); if(!d.exercises||!d.programs||!d.sessions) throw new Error('not a Lift backup'); S=d; save(); history_=[]; go('home',{},false); toast('Backup imported'); }).catch(err=>toast('Import failed: '+err.message)); t.value=''; return; }
  if(t.dataset.f){ const st=S.active.items[+t.dataset.ii].sets[+t.dataset.si]; const v=parseFloat(t.value); st[t.dataset.f]=isNaN(v)?null:v; save(); return; }
  if(t.dataset.cardio){ const v=parseFloat(t.value); S.active.cardio[t.dataset.cardio]=isNaN(v)?null:v; save(); return; }
  if(t.dataset.setting){ S[t.dataset.setting]=t.value.trim()||S[t.dataset.setting]; save(); return; }
  if(t.dataset.prog){ const p=progById(route.id); p[t.dataset.prog]=t.value.trim()||p[t.dataset.prog]; save(); return; }
  if(t.dataset.ed){ const it=progById(route.id).items[+t.dataset.i]; const k=t.dataset.ed;
    if(k==='ss') it.ss=t.checked; else if(k==='exId') it.exId=t.value; else it[k]=Math.max(k==='rest'?0:1,parseInt(t.value,10)||0); save(); if(k==='exId'||k==='ss') render(); }
});
document.addEventListener('focusin',e=>{ if(e.target.matches('input[type=number]')) e.target.select(); });

/* ---------- boot ---------- */
(async()=>{
  try{ S=await DB.get('data'); }catch(e){}
  if(!S){ S=seed(); save(); }
  if(S.active) route={view:'workout'};
  render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
